<!DOCTYPE html>
<html lang="zh-CN" data-theme="tokyo-night">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <meta name="theme-color" content="#13141c">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <title>《曹操不容易》// 赤壁前夜 · 建安十三年冬</title>
  <style>
/* ==========================================================================
   《曹操不容易》 // 赤壁前夜 Mobile Demo
   Visual Bible: Omarchy Quattro / Tokyo Night (Strict, Square, Zero-Bloat)
   ========================================================================== */

:root,
[data-theme="tokyo-night"],
[data-theme="red-cliffs"] {
  /* Default Chapter 1 Palette: 赤壁玄墨 · 烬火 (Overridable per-chapter via STORY.theme.palette) */
  --bg: #151210;
  --bg-dark: #0f0c0b;
  --bg-darker: #0a0807;
  --bg-light: #221c18;
  --fg: #dfd5c5;
  --fg-dim: #9c8d7a;
  --fg-bright: #f6eee0;
  --accent: #e86f3a;
  --accent-soft: rgba(232, 111, 58, 0.16);
  --selection: #2e241d;
  --muted: #3d332c;
  --danger: #e04f5f;
  --warn: #d9a84e;
  --fire: #f08a4b;
  --ok: #7fb069;
  --info: #5aa6a0;
  --teal: #5aa6a0;
  --special: #b5838d;
  --earth: #75493d;

  --radius: 2px;
  --border: 1px solid var(--muted);
  --font-ui: "JetBrains Mono", "Sarasa Mono SC", "Noto Sans Mono CJK SC", ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace;
  --font-prose: "IBM Plex Sans", "Noto Sans SC", "PingFang SC", "Hiragino Sans GB", "Microsoft YaHei", system-ui, -apple-system, sans-serif;
  --font-serif: "Noto Serif SC", "Songti SC", "STSong", "SimSun", Georgia, serif;

  --safe-top: env(safe-area-inset-top, 0px);
  --safe-bottom: env(safe-area-inset-bottom, 0px);
}

*,
*::before,
*::after {
  box-sizing: border-box;
  -webkit-tap-highlight-color: transparent;
}

html,
body {
  margin: 0;
  padding: 0;
  height: 100%;
  background: var(--bg-darker);
  color: var(--fg);
  font-family: var(--font-prose);
  font-size: 15px;
  line-height: 1.6;
  -webkit-font-smoothing: antialiased;
  overflow: hidden;
  user-select: none;
}

button {
  font-family: inherit;
  color: inherit;
  background: none;
  border: none;
  padding: 0;
  cursor: pointer;
  touch-action: manipulation;
}

button:focus-visible {
  outline: 1px solid var(--accent);
  outline-offset: 1px;
}

/* ==========================================================================
   App Shell & Liftoff Dusk Atmosphere
   ========================================================================== */

.viewport-frame {
  width: 100%;
  height: 100dvh;
  display: flex;
  justify-content: center;
  background: var(--bg-darker);
}

.app-shell {
  position: relative;
  width: 100%;
  max-width: 460px;
  height: 100dvh;
  display: flex;
  flex-direction: column;
  background: var(--bg);
  overflow: hidden;
}

@media (min-width: 480px) {
  .app-shell {
    border-left: 1px solid var(--muted);
    border-right: 1px solid var(--muted);
  }
}

.chapter-bg-image {
  position: absolute;
  inset: 0;
  z-index: 0;
  pointer-events: none;
  background-position: center bottom;
  background-size: cover;
  background-repeat: no-repeat;
  opacity: 0.42;
  transition: opacity 600ms ease, filter 600ms ease;
}

.app-shell[data-mood="fire"] .chapter-bg-image {
  opacity: 0.54;
  filter: saturate(1.25) contrast(1.06);
}

.atmosphere-bg {
  position: absolute;
  inset: 0;
  pointer-events: none;
  z-index: 0;
  transition: opacity 420ms ease, background 420ms ease;
  background:
    linear-gradient(180deg, rgba(15, 12, 11, 0.82) 0%, rgba(15, 12, 11, 0.56) 46%, rgba(15, 12, 11, 0.72) 100%),
    radial-gradient(ellipse 110% 55% at 50% 0%, rgba(232, 111, 58, 0.08) 0%, transparent 70%),
    radial-gradient(ellipse 100% 45% at 50% 100%, rgba(90, 166, 160, 0.07) 0%, transparent 70%);
}

.app-shell[data-mood="calm"] .atmosphere-bg {
  background:
    linear-gradient(180deg, rgba(15, 12, 11, 0.82) 0%, rgba(15, 12, 11, 0.56) 46%, rgba(15, 12, 11, 0.72) 100%),
    radial-gradient(ellipse 110% 55% at 50% 0%, rgba(232, 111, 58, 0.07) 0%, transparent 70%),
    radial-gradient(ellipse 100% 45% at 50% 100%, rgba(90, 166, 160, 0.08) 0%, transparent 70%);
}

.app-shell[data-mood="tense"] .atmosphere-bg {
  background:
    linear-gradient(180deg, rgba(15, 12, 11, 0.84) 0%, rgba(15, 12, 11, 0.52) 48%, rgba(20, 14, 10, 0.76) 100%),
    radial-gradient(ellipse 115% 55% at 50% 100%, rgba(217, 168, 78, 0.14) 0%, transparent 72%);
}

.app-shell[data-mood="cold"] .atmosphere-bg {
  background:
    linear-gradient(180deg, rgba(12, 14, 15, 0.84) 0%, rgba(12, 15, 16, 0.56) 48%, rgba(10, 12, 14, 0.76) 100%),
    radial-gradient(ellipse 110% 60% at 50% 0%, rgba(90, 166, 160, 0.14) 0%, transparent 72%);
}

.app-shell[data-mood="fire"] .atmosphere-bg {
  background:
    linear-gradient(180deg, rgba(18, 10, 9, 0.82) 0%, rgba(22, 12, 10, 0.48) 48%, rgba(24, 10, 8, 0.74) 100%),
    radial-gradient(ellipse 125% 60% at 50% 100%, rgba(232, 111, 58, 0.24) 0%, rgba(224, 79, 95, 0.10) 48%, transparent 80%);
}

.ember-canvas {
  position: absolute;
  inset: 0;
  width: 100%;
  height: 100%;
  pointer-events: none;
  z-index: 1;
}

.app-layer {
  position: relative;
  z-index: 2;
  display: flex;
  flex-direction: column;
  height: 100%;
  min-height: 0;
}

.hidden {
  display: none !important;
}

/* ==========================================================================
   Splash Screen (Terminal meets Bamboo Slip)
   ========================================================================== */

.splash-screen {
  position: absolute;
  inset: 0;
  z-index: 30;
  display: flex;
  flex-direction: column;
  justify-content: center;
  padding: calc(20px + var(--safe-top)) 20px calc(24px + var(--safe-bottom));
  background:
    radial-gradient(ellipse 110% 50% at 50% 100%, rgba(255, 158, 100, 0.11) 0%, transparent 70%),
    radial-gradient(ellipse 100% 45% at 50% 0%, rgba(122, 162, 247, 0.09) 0%, transparent 65%),
    var(--bg);
}

.splash-card {
  position: relative;
  border: 1px solid var(--muted);
  border-radius: var(--radius);
  background: var(--bg-dark);
  padding: 24px 20px 20px;
}

.splash-card::before {
  content: "";
  position: absolute;
  top: 0;
  left: 0;
  right: 0;
  height: 2px;
  background: linear-gradient(90deg, var(--accent) 0%, var(--fire) 100%);
}

.splash-meta {
  display: flex;
  align-items: center;
  justify-content: space-between;
  font-family: var(--font-ui);
  font-size: 11px;
  letter-spacing: 0.06em;
  color: var(--fg-dim);
  margin-bottom: 14px;
}

.splash-era {
  color: var(--fire);
}

.splash-title {
  margin: 0;
  font-size: 26px;
  font-weight: 700;
  letter-spacing: 0.04em;
  color: var(--fg-bright);
  line-height: 1.25;
}

.splash-subtitle {
  margin: 6px 0 0;
  font-family: var(--font-ui);
  font-size: 13px;
  color: var(--accent);
}

.splash-divider {
  height: 1px;
  background: var(--muted);
  margin: 16px 0;
}

.splash-tagline {
  margin: 0;
  font-size: 15px;
  color: var(--fg-bright);
  line-height: 1.6;
}

.splash-desc {
  margin: 8px 0 0;
  font-size: 13px;
  color: var(--fg-dim);
  line-height: 1.65;
}

.splash-slips {
  display: grid;
  grid-template-columns: repeat(3, 1fr);
  gap: 8px;
  margin-top: 16px;
  padding: 10px 0 0;
  border-top: 1px dashed var(--muted);
}

.splash-slip-item {
  border-left: 2px solid var(--muted);
  padding-left: 8px;
}

.splash-slip-k {
  display: block;
  font-family: var(--font-ui);
  font-size: 10px;
  color: var(--fg-dim);
}

.splash-slip-v {
  display: block;
  font-family: var(--font-ui);
  font-size: 12px;
  color: var(--fg);
  margin-top: 2px;
}

.splash-actions {
  display: flex;
  flex-direction: column;
  gap: 10px;
  margin-top: 20px;
}

.btn-primary {
  width: 100%;
  padding: 12px 14px;
  border: 1px solid var(--accent);
  border-left: 3px solid var(--accent);
  border-radius: var(--radius);
  background: var(--selection);
  color: var(--fg-bright);
  font-family: var(--font-ui);
  font-size: 14px;
  font-weight: 600;
  letter-spacing: 0.04em;
  text-align: center;
  transition: background 120ms ease, border-color 120ms ease, transform 80ms ease;
}

.btn-primary:active {
  transform: translateY(1px);
  background: #333952;
}

.btn-secondary {
  width: 100%;
  padding: 10px 14px;
  border: 1px solid var(--muted);
  border-radius: var(--radius);
  background: var(--bg);
  color: var(--fg);
  font-family: var(--font-ui);
  font-size: 13px;
  text-align: center;
  transition: background 120ms ease, border-color 120ms ease;
}

.btn-secondary:hover,
.btn-secondary:active {
  background: var(--bg-light);
  border-color: var(--fg-dim);
}

.splash-footer {
  display: flex;
  align-items: center;
  justify-content: space-between;
  margin-top: 14px;
  font-family: var(--font-ui);
  font-size: 11px;
  color: var(--fg-dim);
}

.splash-audio-btn {
  display: inline-flex;
  align-items: center;
  gap: 6px;
  padding: 5px 9px;
  border: 1px solid var(--muted);
  border-radius: var(--radius);
  background: var(--bg);
  font-family: var(--font-ui);
  font-size: 11px;
  color: var(--fg);
}

.splash-audio-btn.is-on {
  border-color: var(--accent);
  color: var(--fg-bright);
}

/* ==========================================================================
   Sticky Top HUD (48px) & Chapter Progress Strip (22px)
   ========================================================================== */

.hud-bar {
  flex: 0 0 auto;
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 8px;
  min-height: calc(48px + var(--safe-top));
  padding: var(--safe-top) 10px 0;
  background: var(--bg-dark);
  border-bottom: 1px solid var(--muted);
}

.hud-resources {
  display: flex;
  align-items: center;
  gap: 8px;
  flex: 1;
  min-width: 0;
}

.res-gauge {
  position: relative;
  flex: 1;
  min-width: 0;
  padding: 3px 6px 4px;
  border: 1px solid rgba(65, 72, 104, 0.65);
  border-radius: var(--radius);
  background: var(--bg-darker);
}

.res-top {
  display: flex;
  align-items: baseline;
  justify-content: space-between;
  gap: 4px;
  font-family: var(--font-ui);
  line-height: 1.1;
}

.res-label {
  font-size: 10px;
  color: var(--fg-dim);
  white-space: nowrap;
}

.res-val-wrap {
  display: inline-flex;
  align-items: baseline;
  gap: 3px;
}

.res-val {
  font-size: 12px;
  font-weight: 700;
  color: var(--fg-bright);
  font-variant-numeric: tabular-nums;
}

.res-gauge.is-low .res-val {
  color: var(--danger);
}

.res-gauge.is-warn .res-val {
  color: var(--warn);
}

.res-segs {
  display: flex;
  gap: 2px;
  margin-top: 3px;
  height: 3px;
}

.res-seg {
  flex: 1;
  background: rgba(65, 72, 104, 0.45);
  border-radius: 1px;
  transition: background 180ms ease;
}

.res-gauge[data-res="coin"] .res-seg.filled {
  background: var(--earth);
}

.res-gauge[data-res="grain"] .res-seg.filled {
  background: var(--warn);
}

.res-gauge[data-res="troops"] .res-seg.filled {
  background: var(--accent);
}

.res-gauge.is-low .res-seg.filled {
  background: var(--danger) !important;
}

.fake-troop-badge {
  position: absolute;
  top: -7px;
  right: 18px;
  padding: 0 4px;
  font-family: var(--font-ui);
  font-size: 9px;
  line-height: 13px;
  color: var(--bg-darker);
  background: var(--fire);
  border-radius: 1px;
  font-weight: 700;
  letter-spacing: 0.02em;
  animation: badgePulse 2.2s ease-in-out infinite;
}

.fake-troop-badge.shattering {
  animation: badgeShatter 480ms ease forwards;
}

@keyframes badgePulse {
  0%, 100% { opacity: 1; }
  50% { opacity: 0.62; }
}

@keyframes badgeShatter {
  0% { transform: scale(1) rotate(0deg); opacity: 1; background: var(--danger); }
  45% { transform: scale(1.18) rotate(-4deg); opacity: 0.9; background: var(--danger); }
  100% { transform: scale(0.7) translateY(8px) rotate(9deg); opacity: 0; }
}

.delta-pop {
  position: absolute;
  right: 4px;
  bottom: -16px;
  z-index: 12;
  padding: 1px 5px;
  border-radius: var(--radius);
  font-family: var(--font-ui);
  font-size: 11px;
  font-weight: 700;
  white-space: nowrap;
  pointer-events: none;
  background: var(--bg-darker);
  border: 1px solid var(--muted);
  animation: deltaFloat 1.35s cubic-bezier(0.2, 0.8, 0.2, 1) forwards;
}

.delta-pop.neg {
  color: var(--danger);
  border-color: var(--danger);
}

.delta-pop.pos {
  color: var(--ok);
  border-color: var(--ok);
}

.delta-pop.zero {
  color: var(--fire);
  border-color: var(--fire);
}

@keyframes deltaFloat {
  0% { opacity: 0; transform: translateY(4px); }
  16% { opacity: 1; transform: translateY(0); }
  75% { opacity: 1; transform: translateY(-6px); }
  100% { opacity: 0; transform: translateY(-13px); }
}

.hud-actions {
  display: flex;
  align-items: center;
  gap: 6px;
  flex: 0 0 auto;
}

.hud-btn {
  display: inline-flex;
  align-items: center;
  justify-content: center;
  width: 32px;
  height: 32px;
  border: 1px solid var(--muted);
  border-radius: var(--radius);
  background: var(--bg);
  color: var(--fg);
  font-family: var(--font-ui);
  font-size: 12px;
  transition: border-color 120ms ease, color 120ms ease, background 120ms ease;
}

.hud-btn:active {
  background: var(--selection);
}

.hud-btn.is-active {
  border-color: var(--accent);
  color: var(--accent);
}

.hud-btn svg {
  width: 15px;
  height: 15px;
  stroke: currentColor;
  fill: none;
  stroke-width: 1.8;
  stroke-linecap: square;
  stroke-linejoin: miter;
}

/* Chapter Strip */
.chapter-strip {
  position: relative;
  flex: 0 0 auto;
  height: 24px;
  display: flex;
  align-items: center;
  justify-content: space-between;
  padding: 0 12px;
  background: var(--bg-darker);
  border-bottom: 1px solid var(--muted);
  font-family: var(--font-ui);
  font-size: 11px;
  color: var(--fg-dim);
}

.chapter-label {
  display: flex;
  align-items: center;
  gap: 6px;
  min-width: 0;
  overflow: hidden;
  text-overflow: ellipsis;
  white-space: nowrap;
}

.chapter-act {
  color: var(--accent);
  font-weight: 700;
}

.chapter-step {
  font-variant-numeric: tabular-nums;
  color: var(--fg-dim);
}

.chapter-progress-track {
  position: absolute;
  left: 0;
  right: 0;
  bottom: 0;
  height: 2px;
  background: rgba(65, 72, 104, 0.35);
}

.chapter-progress-fill {
  height: 100%;
  width: 0%;
  background: var(--accent);
  transition: width 260ms ease, background 260ms ease;
}

.app-shell[data-mood="fire"] .chapter-progress-fill {
  background: var(--fire);
}

/* ==========================================================================
   Lifeline Chat Stream
   ========================================================================== */

.chat-stream {
  flex: 1 1 auto;
  min-height: 0;
  overflow-y: auto;
  overscroll-behavior-y: contain;
  -webkit-overflow-scrolling: touch;
  padding: 14px 12px 24px;
  display: flex;
  flex-direction: column;
  gap: 10px;
}

.chat-stream::-webkit-scrollbar {
  width: 3px;
}

.chat-stream::-webkit-scrollbar-thumb {
  background: var(--muted);
}

/* Chapter Divider inside stream */
.chapter-divider {
  flex: 0 0 auto;
  display: flex;
  align-items: center;
  gap: 10px;
  margin: 8px 0 4px;
  font-family: var(--font-ui);
  font-size: 11px;
  color: var(--fg-dim);
  letter-spacing: 0.06em;
  animation: bubbleIn 150ms ease-out both;
}

.chapter-divider::before,
.chapter-divider::after {
  content: "";
  flex: 1;
  height: 1px;
  background: var(--muted);
}

.chapter-divider span {
  color: var(--fg-bright);
  padding: 1px 6px;
  border: 1px solid var(--muted);
  border-radius: var(--radius);
  background: var(--bg-dark);
}

/* Bubbles */
.bubble-row {
  flex: 0 0 auto;
  display: flex;
  flex-direction: column;
  width: 100%;
  animation: bubbleIn 140ms cubic-bezier(0.2, 0.8, 0.2, 1) both;
}

.bubble-row.side-left {
  align-items: flex-start;
}

.bubble-row.side-right {
  align-items: flex-end;
}

.bubble-row.side-center {
  align-items: stretch;
}

@keyframes bubbleIn {
  from {
    opacity: 0;
    transform: translateY(6px);
  }
  to {
    opacity: 1;
    transform: translateY(0);
  }
}

.bubble {
  max-width: 89%;
  padding: 9px 11px;
  border: 1px solid var(--muted);
  border-radius: var(--radius);
  background: var(--bg-light);
  color: var(--fg);
  font-size: 14.5px;
  line-height: 1.62;
  word-break: break-word;
}

.bubble-row.side-left .bubble {
  border-left: 2px solid var(--bubble-tone, var(--accent));
}

.bubble-row.side-right .bubble {
  max-width: 85%;
  background: var(--selection);
  color: var(--fg-bright);
  border-right: 2px solid var(--accent);
}

/* Frameless Background Typography for Walking / Observation / Scene Transitions */
.bubble-row.side-center {
  margin: 6px 0;
}

.bubble-row.side-center .bubble {
  max-width: 100%;
  padding: 10px 10px 12px;
  background: transparent;
  border: none;
  border-top: 1px solid rgba(156, 141, 122, 0.18);
  border-bottom: 1px solid rgba(156, 141, 122, 0.12);
  border-radius: 0;
  color: var(--fg);
  font-family: var(--font-serif);
  font-size: 14.5px;
  line-height: 1.85;
  letter-spacing: 0.04em;
  text-shadow: 0 1px 10px rgba(8, 6, 5, 0.96), 0 0 2px rgba(8, 6, 5, 0.95);
}

.bubble-row.side-center .bubble .bubble-head {
  justify-content: center;
  margin-bottom: 6px;
}

.bubble-row.side-center .bubble .bubble-speaker {
  color: var(--teal);
  font-family: var(--font-ui);
  font-size: 11px;
  letter-spacing: 0.14em;
}

.bubble-row.side-center .bubble.is-walk .bubble-speaker::before,
.bubble-row.side-center .bubble.is-walk .bubble-speaker::after {
  content: " — ";
  color: var(--fg-dim);
}
  color: var(--fg);
  font-size: 13.5px;
}

.bubble[data-tone="accent"] { --bubble-tone: var(--accent); }
.bubble[data-tone="fire"] { --bubble-tone: var(--fire); }
.bubble[data-tone="info"] { --bubble-tone: var(--info); }
.bubble[data-tone="warn"] { --bubble-tone: var(--warn); }
.bubble[data-tone="danger"] { --bubble-tone: var(--danger); }
.bubble[data-tone="ok"] { --bubble-tone: var(--ok); }
.bubble[data-tone="special"] { --bubble-tone: var(--special); }
.bubble[data-tone="earth"] { --bubble-tone: var(--earth); }
.bubble[data-tone="muted"] { --bubble-tone: var(--fg-dim); }

.bubble-head {
  display: flex;
  align-items: center;
  flex-wrap: wrap;
  gap: 6px;
  margin-bottom: 4px;
  font-family: var(--font-ui);
  font-size: 11px;
  line-height: 1.2;
}

.bubble-speaker {
  font-weight: 700;
  color: var(--fg-bright);
}

.bubble-role {
  color: var(--fg-dim);
}

.source-tag {
  margin-left: auto;
  padding: 0 4px;
  border: 1px solid var(--muted);
  border-radius: 1px;
  font-size: 10px;
  color: var(--fg-dim);
  background: var(--bg-darker);
}

.source-tag.tag-ni {
  color: var(--info);
  border-color: rgba(68, 157, 171, 0.55);
}

.source-tag.tag-yanyi {
  color: var(--special);
  border-color: rgba(173, 142, 230, 0.55);
}

body.hide-source-tags .source-tag {
  display: none;
}

.bubble-body {
  white-space: pre-line;
}

/* Settlement Strip */
.settlement-strip {
  flex: 0 0 auto;
  display: flex;
  align-items: flex-start;
  gap: 8px;
  width: 100%;
  padding: 7px 10px;
  border: 1px solid var(--muted);
  border-left: 2px solid var(--warn);

.settlement-strip.is-pos {

}

.settlement-strip.is-zero {

}

.settlement-badge {

.settlement-strip.is-neg .settlement-badge {

.settlement-strip.is-pos .settlement-badge {

.settlement-strip.is-zero .settlement-badge {

.settlement-reason {

/* ==========================================================================
   Inline Clickable Language Features (Gloss & Subtext)
   ========================================================================== */

.inline-bold {
  color: var(--fg-bright);
  font-weight: 700;
}

.inline-gloss,
.inline-subtext {
  display: inline;
  padding: 0 1px;
  border-radius: 1px;
  cursor: pointer;
  color: var(--fg-bright);
  transition: background 100ms ease;
}

.inline-gloss {
  border-bottom: 1px dotted var(--accent);
}

.inline-gloss:active {
  background: rgba(122, 162, 247, 0.22);
}

.inline-subtext {
  border-bottom: 1px dashed var(--fire);
}

.inline-subtext.is-decoded {
  border-bottom-color: var(--ok);
}

.inline-subtext:active {
  background: rgba(255, 158, 100, 0.22);
}

.inline-sup {
  display: inline-block;
  margin-left: 2px;
  padding: 0 2px;
  font-family: var(--font-ui);
  font-size: 9px;
  line-height: 1.2;
  vertical-align: super;
  border-radius: 1px;
}

.inline-gloss .inline-sup {
  color: var(--accent);
  border: 1px solid rgba(122, 162, 247, 0.45);
}

.inline-subtext .inline-sup {
  color: var(--fire);
  border: 1px solid rgba(255, 158, 100, 0.5);
}

.inline-subtext.is-decoded .inline-sup {
  color: var(--ok);
  border-color: rgba(158, 206, 106, 0.5);
}

/* ==========================================================================
   Interactive Inline Widgets (Wordsmith / Inspect / Quip)
   ========================================================================== */

.widget-card {
  flex: 0 0 auto;
  width: 100%;
  border: 1px solid var(--muted);
  border-radius: var(--radius);
  background: var(--bg-dark);
  overflow: hidden;
  animation: bubbleIn 160ms ease-out both;
}

.widget-header {
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 8px;
  padding: 7px 10px;
  background: var(--bg-darker);
  border-bottom: 1px solid var(--muted);
  font-family: var(--font-ui);
  font-size: 11px;
}

.widget-tag {
  color: var(--accent);
  font-weight: 700;
}

.widget-card.type-inspect .widget-tag {
  color: var(--info);
}

.widget-card.type-quip .widget-tag {
  color: var(--warn);
}

.widget-card.type-wordsmith .widget-tag {
  color: var(--fire);
}

.widget-progress {
  color: var(--fg-dim);

}

.widget-body {
  padding: 12px 11px;
}

.widget-prompt {
  margin: 0 0 10px;
  font-size: 13px;
  color: var(--fg-dim);
}

/* Wordsmith */
.ws-letter {
  padding: 11px;
  border: 1px solid rgba(65, 72, 104, 0.85);
  border-left: 2px solid var(--fire);
  border-radius: var(--radius);
  background: var(--bg);

  color: var(--fg-bright);
}

.ws-slot-chip {
  display: inline-flex;

}

.ws-options-drawer {

  flex-direction: column;

}

.ws-options-title {

}

.ws-opt-btn {

  padding: 8px 10px;

  border-radius: var(--radius);
  background: var(--bg-light);
  color: var(--fg);
  font-size: 13.5px;
  line-height: 1.4;
}

.ws-opt-btn.is-selected {
  border-color: var(--accent);
  border-left: 3px solid var(--accent);
  background: var(--selection);
  color: var(--fg-bright);
}

.ws-preview-bar {
  margin-top: 10px;
  padding: 8px 10px;
  border: 1px solid rgba(65, 72, 104, 0.8);
  border-left: 2px solid var(--info);
  border-radius: var(--radius);
  background: var(--bg-darker);
  font-size: 12.5px;
  line-height: 1.5;
  color: var(--fg);
}

.ws-preview-label {
  display: block;
  font-family: var(--font-ui);
  font-size: 10px;
  color: var(--info);
  margin-bottom: 3px;
}

.ws-committed {
  padding: 10px 11px;
  border: 1px solid var(--fire);
  border-left: 3px solid var(--fire);
  border-radius: var(--radius);
  background: var(--bg);
  color: var(--fg-bright);
  font-size: 14px;

}

.ws-committed mark {

/* Inspect */
.inspect-list {

}

.inspect-clause {
  flex: 0 0 auto;
  border: 1px solid var(--muted);
  border-left: 2px solid var(--info);
  border-radius: var(--radius);
  background: var(--bg);
  overflow: hidden;
  transition: border-color 140ms ease;
}

.inspect-clause.is-checked {
  border-left-color: var(--warn);
}

.inspect-clause-btn {
  width: 100%;
  display: flex;
  align-items: flex-start;
  justify-content: space-between;
  gap: 8px;
  padding: 9px 10px;
  text-align: left;
  font-size: 14px;
  line-height: 1.55;
  color: var(--fg-bright);
}

.inspect-clause-btn:active {
  background: var(--selection);
}

.inspect-mark {
  flex: 0 0 auto;
  margin-top: 2px;
  padding: 1px 5px;
  border: 1px solid var(--info);
  border-radius: 1px;
  font-family: var(--font-ui);
  font-size: 10px;
  color: var(--info);
}

.inspect-clause.is-checked .inspect-mark {

}

.inspect-deduction {
  padding: 8px 10px;

  background: var(--bg-darker);

  animation: bubbleIn 130ms ease-out both;
}

.inspect-deduction-speaker {
  font-family: var(--font-ui);
  font-size: 11px;
  color: var(--warn);
  margin-right: 6px;
}

/* Quip */
.quip-options {
  display: flex;
  flex-direction: column;
  gap: 8px;
}

.quip-btn {
  display: flex;
  align-items: flex-start;
  gap: 8px;
  width: 100%;
  padding: 9px 10px;
  border: 1px solid var(--muted);
  border-left: 2px solid var(--warn);
  border-radius: var(--radius);
  background: var(--bg-light);
  color: var(--fg-bright);
  text-align: left;
  font-size: 14px;
  line-height: 1.48;
}

.quip-btn:active {
  background: var(--selection);
}

.quip-idx {
  flex: 0 0 auto;
  font-family: var(--font-ui);
  font-size: 11px;
  color: var(--warn);
  margin-top: 2px;
}

.widget-footer {
  margin-top: 12px;
  display: flex;
  justify-content: flex-end;
}

.widget-confirm-btn {
  width: 100%;
  padding: 10px 12px;
  border: 1px solid var(--accent);
  border-radius: var(--radius);
  background: var(--selection);
  color: var(--fg-bright);
  font-family: var(--font-ui);
  font-size: 13px;
  font-weight: 600;
  text-align: center;
}

.widget-confirm-btn:disabled {

}

/* ==========================================================================
   Dynamic War Report Card (N08_battle_report)
   ========================================================================== */

.war-report-card {
  flex: 0 0 auto;
  width: 100%;
  border: 1px solid var(--fire);
  border-radius: var(--radius);
  background: var(--bg-dark);
  overflow: hidden;
  animation: bubbleIn 180ms ease-out both;
}

.war-report-head {
  padding: 10px 12px;
  background: var(--bg-darker);
  border-bottom: 1px solid var(--fire);
  font-family: var(--font-ui);
}

.war-report-kicker {
  font-size: 10px;
  letter-spacing: 0.08em;
  color: var(--fire);
  text-transform: uppercase;
}

.war-report-title {
  margin: 3px 0 0;
  font-size: 16px;
  font-weight: 700;
  color: var(--fg-bright);
}

.war-report-body {
  padding: 12px;
  display: flex;
  flex-direction: column;
  gap: 10px;
}

.war-report-opening {
  font-family: var(--font-ui);
  font-size: 13px;
  line-height: 1.65;
  color: var(--fg);
  padding-bottom: 8px;
  border-bottom: 1px dashed var(--muted);
}

.war-section {
  padding: 9px 10px;
  border: 1px solid var(--muted);
  border-left: 2px solid var(--fire);
  border-radius: var(--radius);
  background: var(--bg);
  animation: bubbleIn 150ms ease-out both;
}

.war-section[data-tone="danger"] { border-left-color: var(--danger); }
.war-section[data-tone="ok"] { border-left-color: var(--ok); }
.war-section[data-tone="warn"] { border-left-color: var(--warn); }
.war-section[data-tone="info"] { border-left-color: var(--info); }

.war-section-head {
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 8px;
  font-family: var(--font-ui);
  font-size: 11px;
  color: var(--fire);
  margin-bottom: 4px;
}

.war-section[data-tone="danger"] .war-section-head { color: var(--danger); }
.war-section[data-tone="ok"] .war-section-head { color: var(--ok); }
.war-section[data-tone="warn"] .war-section-head { color: var(--warn); }

.war-section-text {
  font-size: 13.5px;
  line-height: 1.6;
  color: var(--fg-bright);
  white-space: pre-line;
}

/* ==========================================================================
   Bottom Pinned Controls: Tap Prompt & Two-Evils Choice Deck
   ========================================================================== */

.bottom-dock {
  flex: 0 0 auto;
  background: var(--bg-dark);
  border-top: 1px solid var(--muted);
  padding-bottom: var(--safe-bottom);
}

.tap-prompt {
  display: flex;
  align-items: center;
  justify-content: space-between;
  width: 100%;
  padding: 11px 14px;
  font-family: var(--font-ui);
  font-size: 12px;
  color: var(--fg-dim);
  background: var(--bg-dark);
}

.tap-prompt:active {
  background: var(--bg-light);
}

.tap-prompt-left {
  display: flex;
  align-items: center;
  gap: 6px;
  color: var(--fg);
}

.cursor-blink {
  display: inline-block;
  width: 7px;
  height: 13px;
  background: var(--accent);
  animation: blink 1s steps(2, start) infinite;
}

@keyframes blink {
  0%, 100% { opacity: 1; }
  50% { opacity: 0; }
}

.choice-deck {
  padding: 10px 12px 12px;
  display: flex;
  flex-direction: column;
  gap: 8px;
  animation: deckSlideUp 150ms cubic-bezier(0.2, 0.8, 0.2, 1) both;
}

@keyframes deckSlideUp {
  from {
    opacity: 0;
    transform: translateY(10px);
  }
  to {
    opacity: 1;
    transform: translateY(0);
  }
}

.choice-deck-hint {
  font-family: var(--font-ui);
  font-size: 10px;
  color: var(--fg-dim);
  letter-spacing: 0.05em;
  display: flex;
  justify-content: space-between;
}

.choice-btn {
  width: 100%;
  text-align: left;
  padding: 11px 12px;
  border: 1px solid var(--muted);
  border-left: 3px solid var(--muted);
  border-radius: var(--radius);
  background: var(--bg-light);
  transition: background 100ms ease, border-color 100ms ease, transform 80ms ease;
}

.choice-btn.is-bait {
  border-left-color: var(--accent);
}

.choice-btn:active {
  transform: translateY(1px);
  background: var(--selection);
}

.choice-label {
  display: block;
  font-size: 14.5px;
  font-weight: 600;
  color: var(--fg-bright);
  line-height: 1.4;
}

.choice-bait {
  display: block;
  margin-top: 4px;
  font-family: var(--font-ui);
  font-size: 11.5px;
  color: var(--fg-dim);
  line-height: 1.35;
}

.choice-btn.is-bait .choice-bait {
  color: var(--accent);
}

   Ending & Historical Dossier Screen (Rendered in stream)

.ending-hero {

.ending-badge {

  margin-bottom: 8px;
}

.ending-card[data-tone="ok"] .ending-hero { border-top-color: var(--ok); }
.ending-card[data-tone="ok"] .ending-badge { border-color: var(--ok); color: var(--ok); }
.ending-card[data-tone="warn"] .ending-hero { border-top-color: var(--warn); }
.ending-card[data-tone="warn"] .ending-badge { border-color: var(--warn); color: var(--warn); }
.ending-card[data-tone="danger"] .ending-hero { border-top-color: var(--danger); }
.ending-card[data-tone="danger"] .ending-badge { border-color: var(--danger); color: var(--danger); }

.ending-title {

.ending-section:last-child {

.ending-sec-title {

  font-size: 11px;
  color: var(--fg-dim);

.ending-verdict {

  line-height: 1.65;
  color: var(--fg-bright);

.ending-seed {

  padding: 8px 10px;
  border-left: 2px solid var(--accent);
  background: var(--bg);
  font-size: 13px;
  color: var(--fg);
}

.persona-box {

  border: 1px solid var(--accent);
  border-radius: var(--radius);
  background: var(--selection);
  margin-bottom: 10px;
}

.persona-kicker {
  font-family: var(--font-ui);
  font-size: 10px;
  color: var(--accent);
}

.persona-name {
  font-size: 17px;
  font-weight: 700;
  color: var(--fg-bright);

}

.persona-desc {

  color: var(--fg);

}

.stats-grid {

  gap: 6px;
}

.stat-cell {

  border: 1px solid var(--muted);
  border-radius: var(--radius);
  background: var(--bg);

}

.stat-k {

.stat-v {

.dossier-list {

.dossier-item {

}

.dossier-item-head {

  align-items: center;
  justify-content: space-between;
  gap: 8px;

.dossier-item-title {

.dossier-tag {

.dossier-item-text {

.dossier-item-src {

.ending-actions {

.popover-sheet {

  font-size: 10px;
  color: var(--fire);
  margin-bottom: 4px;

/* ==========================================================================
   Slide-over Drawer (案牍 / 词典 / 设置)
   ========================================================================== */

.drawer-backdrop {
  position: absolute;
  inset: 0;
  z-index: 45;
  background: rgba(14, 14, 20, 0.74);
  display: flex;
  justify-content: flex-end;
  animation: fadeIn 120ms ease-out both;
}

.drawer-panel {
  width: min(88%, 360px);
  height: 100%;
  display: flex;
  flex-direction: column;
  background: var(--bg-dark);
  border-left: 1px solid var(--muted);
  padding-top: var(--safe-top);
  padding-bottom: var(--safe-bottom);
  animation: drawerIn 150ms cubic-bezier(0.2, 0.8, 0.2, 1) both;
}

@keyframes drawerIn {
  from { transform: translateX(18px); opacity: 0; }
  to { transform: translateX(0); opacity: 1; }
}

.drawer-head {
  display: flex;
  align-items: center;
  justify-content: space-between;
  padding: 12px 14px;
  border-bottom: 1px solid var(--muted);
  background: var(--bg-darker);
}

.drawer-title {
  font-family: var(--font-ui);
  font-size: 13px;
  font-weight: 700;
  color: var(--fg-bright);
}

.drawer-tabs {
  display: grid;
  grid-template-columns: repeat(3, 1fr);
  border-bottom: 1px solid var(--muted);
  background: var(--bg-darker);
}

.drawer-tab {
  padding: 9px 6px;
  font-family: var(--font-ui);
  font-size: 11.5px;
  color: var(--fg-dim);
  border-bottom: 2px solid transparent;
}

.drawer-tab.is-active {
  color: var(--fg-bright);
  border-bottom-color: var(--accent);
  background: var(--bg-dark);
}

.drawer-body {
  flex: 1 1 auto;
  overflow-y: auto;
  padding: 12px 14px;
  display: flex;
  flex-direction: column;
  gap: 10px;
}

.drawer-item {
  padding: 9px 10px;
  border: 1px solid var(--muted);
  border-radius: var(--radius);
  background: var(--bg);
}

.drawer-item-title {
  font-size: 13.5px;
  font-weight: 700;
  color: var(--fg-bright);
  margin-bottom: 3px;
}

.drawer-item-text {
  font-size: 12.5px;
  line-height: 1.5;
  color: var(--fg);
}

.drawer-item-meta {
  margin-top: 4px;
  font-family: var(--font-ui);
  font-size: 10.5px;
  color: var(--fg-dim);
}

.drawer-empty {
  padding: 20px 12px;
  text-align: center;
  font-family: var(--font-ui);
  font-size: 12px;
  color: var(--fg-dim);
  border: 1px dashed var(--muted);
  border-radius: var(--radius);
}

.setting-row {
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 10px;
  padding: 10px;
  border: 1px solid var(--muted);
  border-radius: var(--radius);
  background: var(--bg);
}

.setting-info strong {
  display: block;
  font-size: 13px;
  color: var(--fg-bright);
}

.setting-info span {
  display: block;
  font-size: 11.5px;
  color: var(--fg-dim);
}

.toggle-pill {
  flex: 0 0 auto;
  padding: 4px 10px;
  border: 1px solid var(--muted);
  border-radius: var(--radius);
  font-family: var(--font-ui);
  font-size: 11px;
  color: var(--fg-dim);
  background: var(--bg-darker);
}

.toggle-pill.is-on {
  border-color: var(--accent);
  color: var(--fg-bright);
  background: var(--selection);
}

.btn-danger {
  width: 100%;
  padding: 10px 12px;
  border: 1px solid var(--danger);
  border-radius: var(--radius);
  background: rgba(247, 118, 142, 0.08);
  color: var(--danger);
  font-family: var(--font-ui);
  font-size: 12.5px;
  font-weight: 600;
}

/* ==========================================================================
   Character-by-Character Springy Pop-In & Walking Observation Styling
   ========================================================================== */

.char-pop {
  display: inline-block;
  white-space: pre-wrap;
  animation: charSpringPop 155ms cubic-bezier(0.22, 1.35, 0.36, 1) both;
}

.char-pop.is-emph {
  color: var(--fg-bright);
  animation: charEmphPop 185ms cubic-bezier(0.2, 1.45, 0.32, 1) both;
}

.token-pop {
  animation: tokenPop 190ms cubic-bezier(0.22, 1.32, 0.36, 1) both;
}

.typing-caret {
  display: inline-block;
  width: 6px;
  height: 13px;
  margin-left: 2px;
  vertical-align: -2px;
  background: var(--accent);
  opacity: 0.85;
  animation: caretBlink 520ms steps(2, end) infinite;
}

@keyframes charSpringPop {
  0% {
    opacity: 0;
    transform: translateY(5px) scale(0.86);
  }
  65% {
    opacity: 1;
    transform: translateY(-1.5px) scale(1.06);
  }
  100% {
    opacity: 1;
    transform: translateY(0) scale(1);
  }
}

@keyframes charEmphPop {
  0% {
    opacity: 0;
    transform: translateY(7px) scale(0.82);
  }
  60% {
    opacity: 1;
    transform: translateY(-2.5px) scale(1.12);
  }
  100% {
    opacity: 1;
    transform: translateY(0) scale(1);
  }
}

@keyframes tokenPop {
  0% {
    opacity: 0;
    transform: translateY(4px) scale(0.92);
  }
  70% {
    opacity: 1;
    transform: translateY(-1px) scale(1.03);
  }
  100% {
    opacity: 1;
    transform: translateY(0) scale(1);
  }
}

@keyframes caretBlink {
  0%, 49% { opacity: 0.9; }
  50%, 100% { opacity: 0.15; }
}

/* Remove old boxed walk override; side-center is now pure frameless background typography */
.bubble-row.side-center .bubble.is-walk {
  background: transparent;
  border-left: none;
  text-align: left;
  color: var(--fg-bright);
  padding: 12px 12px 14px;
}

/* ==========================================================================
   Resource Warning / Red-Line Alerts & Interactive Gauge Click
   ========================================================================== */

.res-gauge {
  cursor: pointer;
  padding: 2px 4px;
  border-radius: var(--radius);
  transition: background 140ms ease, box-shadow 140ms ease;
}

.res-gauge:active {
  background: rgba(255, 255, 255, 0.05);
}

.res-gauge.is-warning {
  background: rgba(217, 168, 78, 0.12);
  box-shadow: inset 0 0 0 1px rgba(217, 168, 78, 0.55);
  animation: gaugePulseWarn 1.8s ease-in-out infinite;
}

.res-gauge.is-critical {
  background: rgba(224, 79, 95, 0.18);
  box-shadow: inset 0 0 0 1px rgba(224, 79, 95, 0.85);
  animation: gaugePulseCrit 0.9s ease-in-out infinite;
}

.res-warn-tag {
  font-family: var(--font-ui);
  font-size: 9px;
  font-weight: 700;
  color: var(--warn);
  margin-left: 3px;
}

.res-gauge.is-critical .res-warn-tag {
  color: var(--danger);
}

@keyframes gaugePulseWarn {
  0%, 100% { box-shadow: inset 0 0 0 1px rgba(217, 168, 78, 0.35); }
  50% { box-shadow: inset 0 0 0 1px rgba(217, 168, 78, 0.9); }
}

@keyframes gaugePulseCrit {
  0%, 100% { box-shadow: inset 0 0 0 1px rgba(224, 79, 95, 0.45); }
  50% { box-shadow: inset 0 0 0 1px rgba(224, 79, 95, 1); }
}

.settlement-strip.is-warn {
  border-color: var(--warn);
  border-left: 3px solid var(--warn);
  background: rgba(217, 168, 78, 0.10);
}

.settlement-strip.is-warn .settlement-badge {
  color: var(--warn);
  border-color: rgba(217, 168, 78, 0.55);
}

/* ==========================================================================
   LLM Review & Logical Consistency Critique Module (Ending Screen)
   ========================================================================== */

.llm-review-box {
  display: flex;
  flex-direction: column;
  gap: 10px;
}

.llm-diagnosis {
  padding: 10px 12px;
  border: 1px solid var(--muted);
  border-left: 3px solid var(--teal);
  border-radius: var(--radius);
  background: var(--bg);
  font-size: 13.5px;
  line-height: 1.65;
  color: var(--fg);
}

.llm-diagnosis strong {
  color: var(--fg-bright);
}

.llm-prompt-details {
  border: 1px solid var(--muted);
  border-radius: var(--radius);
  background: var(--bg-darker);
  overflow: hidden;
}

.llm-prompt-details summary {
  padding: 8px 10px;
  font-family: var(--font-ui);
  font-size: 11.5px;
  color: var(--fg-dim);
  cursor: pointer;
  user-select: none;
}

.llm-prompt-code {
  margin: 0;
  padding: 10px;
  border-top: 1px solid var(--muted);
  font-family: var(--font-ui);
  font-size: 11px;
  line-height: 1.55;
  color: var(--fg);
  white-space: pre-wrap;
  word-break: break-word;
  max-height: 220px;
  overflow-y: auto;
  user-select: text;
}

.btn-copy-prompt {
  width: 100%;
  padding: 10px 12px;
  border: 1px solid var(--accent);
  border-radius: var(--radius);
  background: var(--accent-soft);
  color: var(--fg-bright);
  font-family: var(--font-ui);
  font-size: 12.5px;
  font-weight: 700;

.btn-copy-prompt:active {

}

.btn-copy-prompt.is-copied {
  border-color: var(--ok);
  background: rgba(127, 176, 105, 0.16);
  color: var(--ok);
}

/* ==========================================================================

@media (prefers-reduced-motion: reduce) {

  *::before,
  *::after {
    animation-duration: 0.01ms !important;

    transition-duration: 0.01ms !important;
  }
}

  <script>
/* ==========================================================================

  "use strict";

  let bgmGain = null;
  let sfxGain = null;

  // Fallback = plain HTML5 <audio> (for file:// where fetch is blocked) -> Warm synth pad
  let bgmSrc = "./bgm-red-cliffs.mp3";
  let bgmMoodRates = { calm: 1.0, tense: 0.94, fire: 0.88 };
  let bgmBuffer = null;
  let bgmBufferSrcUrl = null;
  let bgmBufferLoading = false;
  let bgmBufferNode = null;
  let bgmAudioEl = null;
  let bgmFallbackNodes = null;
  let bgmUsingElFallback = false;
  let bgmUsingSynthFallback = false;

  let enabled = false;      // Master audio state (starts off until user gesture / toggle)
  let bgmEnabled = true;    // Ambient BGM flag when master is enabled
  let hapticsEnabled = true;
  let currentMood = "calm";
  let lastCharTickAt = 0;

  /* ------------------------------------------------------------------------
     Haptics Helper (Mobile Tactile Feedback)
     ------------------------------------------------------------------------ */

  function vibrate(pattern) {
    if (!hapticsEnabled) return;
    try {
      if (global.navigator && typeof global.navigator.vibrate === "function") {
        global.navigator.vibrate(pattern);

    }

      masterGain.connect(ctx.destination);

      bgmGain = ctx.createGain();
      bgmGain.gain.value = 0.42;
      bgmGain.connect(masterGain);

      sfxGain = ctx.createGain();
      sfxGain.gain.value = 0.72;
      sfxGain.connect(masterGain);

      // Short filtered white-noise buffer for organic tactile clicks
      const len = Math.floor(ctx.sampleRate * 0.12);
      noiseBuffer = ctx.createBuffer(1, len, ctx.sampleRate);
      const data = noiseBuffer.getChannelData(0);

  /* ------------------------------------------------------------------------

  function startFallbackPad() {

    // Ultra-warm Dmaj7 slow-motion drone pad if bgm.mp3 cannot load

      bgmBufferSrcUrl = null;

      node.playbackRate.setValueAtTime(rate, ctx.currentTime);

    }

  function stopBufferNode() {
    if (bgmBufferNode) {
      try {
        bgmBufferNode.stop();
        bgmBufferNode.disconnect();
      } catch (e) {}

    }
