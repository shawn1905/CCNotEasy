<!DOCTYPE html>
<html lang="zh-CN" data-theme="red-cliffs">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <meta name="theme-color" content="#0f0c0b">
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'><rect width='32' height='32' fill='%23151210'/><rect x='2' y='2' width='28' height='28' fill='none' stroke='%23e86f3a' stroke-width='2'/><text x='16' y='22' text-anchor='middle' fill='%23e86f3a' font-size='16' font-family='serif'>曹</text></svg>">
  <title>《曹操不容易》// V2 实验切片 · 江陵柜台日</title>
  <style>
    :root {
      --bg: #151210;
      --bg-dark: #0f0c0b;
      --bg-darker: #0a0807;
      --bg-light: #221c18;
      --fg: #dfd5c5;
      --fg-dim: #9c8d7a;
      --fg-bright: #f6eee0;
      --accent: #e86f3a;
      --accent-soft: rgba(232, 111, 58, 0.16);
      --danger: #e04f5f;
      --warn: #d9a84e;
      --ok: #7fb069;
      --teal: #5aa6a0;
      --muted: #3d332c;
      --selection: #2e241d;
      --radius: 2px;
      --font-ui: "JetBrains Mono", "Sarasa Mono SC", ui-monospace, SFMono-Regular, Menlo, monospace;
      --font-prose: "IBM Plex Sans", "Noto Sans SC", "PingFang SC", "Microsoft YaHei", system-ui, sans-serif;
      --font-serif: "Noto Serif SC", "Songti SC", "STSong", Georgia, serif;
    }

    *, *::before, *::after { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }

    html, body {
      margin: 0; padding: 0; height: 100%;
      background: var(--bg-darker); color: var(--fg);
      font-family: var(--font-prose); font-size: 15px; line-height: 1.6;
      overflow: hidden; user-select: none; -webkit-font-smoothing: antialiased;
    }

    button {
      font-family: inherit; color: inherit; background: none;
      border: none; padding: 0; cursor: pointer; touch-action: manipulation;
    }

    .viewport-frame {
      width: 100%; height: 100dvh; display: flex; justify-content: center;
      background: var(--bg-darker);
    }

    .app-shell {
      position: relative; width: 100%; max-width: 460px; height: 100dvh;
      display: flex; flex-direction: column; background: var(--bg); overflow: hidden;
    }

    @media (min-width: 480px) {
      .app-shell { border-left: 1px solid var(--muted); border-right: 1px solid var(--muted); }
    }

    /* Chapter Theme 3-Piece Background Layer */
    .chapter-bg {
      position: absolute; inset: 0; z-index: 0; pointer-events: none;
      background: url("./bg-red-cliffs.jpg") center bottom / cover no-repeat;
      opacity: 0.44; transition: opacity 500ms ease, filter 500ms ease;
    }
    .app-shell[data-mood="fire"] .chapter-bg { opacity: 0.56; filter: saturate(1.28); }

    .atmosphere {
      position: absolute; inset: 0; z-index: 0; pointer-events: none;
      background:
        linear-gradient(180deg, rgba(15, 12, 11, 0.84) 0%, rgba(15, 12, 11, 0.55) 45%, rgba(15, 12, 11, 0.78) 100%),
        radial-gradient(ellipse 110% 50% at 50% 100%, rgba(232, 111, 58, 0.14) 0%, transparent 72%);
      transition: background 450ms ease;
    }
    .app-shell[data-mood="fire"] .atmosphere {
      background:
        linear-gradient(180deg, rgba(18, 10, 9, 0.84) 0%, rgba(22, 11, 9, 0.50) 45%, rgba(26, 9, 8, 0.78) 100%),
        radial-gradient(ellipse 120% 58% at 50% 100%, rgba(232, 111, 58, 0.28) 0%, rgba(224, 79, 95, 0.12) 48%, transparent 80%);
    }

    .app-layer {
      position: relative; z-index: 2; flex: 1; min-height: 0;
      display: flex; flex-direction: column;
    }

    /* Splash */
    .splash {
      position: absolute; inset: 0; z-index: 20;
      display: flex; align-items: center; justify-content: center; padding: 18px;
      background: rgba(10, 8, 7, 0.86);
    }
    .splash.hidden { display: none; }
    .splash-card {
      width: 100%; border: 1px solid var(--muted); border-top: 2px solid var(--accent);
      border-radius: var(--radius); background: rgba(15, 12, 11, 0.94); padding: 18px 16px;
    }
    .splash-kicker {
      display: flex; justify-content: space-between; font-family: var(--font-ui);
      font-size: 10.5px; color: var(--fg-dim); letter-spacing: 0.06em;
    }
    .splash-kicker span:last-child { color: var(--accent); }
    .splash-title { margin: 10px 0 4px; font-size: 24px; font-weight: 700; color: var(--fg-bright); }
    .splash-sub { font-family: var(--font-ui); font-size: 12.5px; color: var(--accent); margin-bottom: 12px; }
    .splash-desc {
      margin: 0 0 14px; font-size: 13.5px; line-height: 1.65; color: var(--fg);
      border-left: 2px solid var(--teal); padding-left: 10px;
    }
    .splash-rules {
      display: grid; grid-template-columns: repeat(3, 1fr); gap: 6px; margin-bottom: 16px;
    }
    .rule-pill {
      padding: 7px 6px; border: 1px solid var(--muted); border-radius: var(--radius);
      background: var(--bg-darker); text-align: center;
    }
    .rule-pill strong { display: block; font-family: var(--font-ui); font-size: 11px; color: var(--fg-bright); }
    .rule-pill span { display: block; font-size: 10.5px; color: var(--fg-dim); margin-top: 2px; }
    .btn-primary {
      width: 100%; padding: 11px 14px; border: 1px solid var(--accent);
      border-left: 3px solid var(--accent); border-radius: var(--radius);
      background: var(--accent-soft); color: var(--fg-bright);
      font-size: 14.5px; font-weight: 700; letter-spacing: 0.04em;
    }
    .btn-primary:active { transform: translateY(1px); background: rgba(232, 111, 58, 0.28); }
    .splash-foot {
      margin-top: 12px; display: flex; justify-content: space-between; align-items: center;
      font-family: var(--font-ui); font-size: 11px; color: var(--fg-dim);
    }
    .audio-pill {
      padding: 4px 8px; border: 1px solid var(--muted); border-radius: var(--radius);
      font-family: var(--font-ui); font-size: 11px; color: var(--fg);
    }
    .audio-pill.is-on { border-color: var(--accent); color: var(--accent); }

    /* Dual-Axis HUD: Row 1 Blood Bars + Row 2 Ticking Deadline ("Rent") */
    .hud-wrap {
      flex: 0 0 auto; background: rgba(15, 12, 11, 0.94);
      border-bottom: 1px solid var(--muted);
      padding: calc(6px + env(safe-area-inset-top, 0px)) 10px 7px;
      display: flex; flex-direction: column; gap: 6px;
    }
    .hud-row-1 { display: flex; align-items: center; gap: 6px; }
    .res-grid { flex: 1; display: grid; grid-template-columns: repeat(3, 1fr); gap: 6px; }
    .res-box {
      padding: 4px 6px; border: 1px solid var(--muted); border-radius: var(--radius);
      background: var(--bg-darker); text-align: left; position: relative;
      transition: border-color 180ms ease, background 180ms ease;
    }
    .res-box.is-warn {
      border-color: var(--warn); background: rgba(217, 168, 78, 0.12);
      animation: pulseWarn 1.6s ease-in-out infinite;
    }
    .res-box.is-crit {
      border-color: var(--danger); background: rgba(224, 79, 95, 0.18);
      animation: pulseCrit 0.9s ease-in-out infinite;
    }
    @keyframes pulseWarn { 0%,100% { border-color: rgba(217,168,78,0.45); } 50% { border-color: #d9a84e; } }
    @keyframes pulseCrit { 0%,100% { border-color: rgba(224,79,95,0.45); } 50% { border-color: #e04f5f; } }

    .res-top { display: flex; justify-content: space-between; align-items: baseline; font-family: var(--font-ui); font-size: 11px; }
    .res-name { color: var(--fg-dim); }
    .res-tag { font-size: 9px; margin-left: 2px; color: var(--warn); font-weight: 700; }
    .res-box.is-crit .res-tag { color: var(--danger); }
    .res-val { font-size: 13px; font-weight: 700; color: var(--fg-bright); }
    .res-bars { display: flex; gap: 2px; margin-top: 3px; }
    .res-seg { flex: 1; height: 3px; background: var(--muted); }
    .res-seg.on { background: var(--accent); }
    .res-box.is-warn .res-seg.on { background: var(--warn); }
    .res-box.is-crit .res-seg.on { background: var(--danger); }

    .delta-pop {
      position: absolute; right: 4px; top: -6px; font-family: var(--font-ui);
      font-size: 11px; font-weight: 700; pointer-events: none;
      animation: floatUp 1.1s ease-out forwards;
    }
    .delta-pop.pos { color: var(--ok); }
    .delta-pop.neg { color: var(--danger); }
    @keyframes floatUp { 0% { opacity: 1; transform: translateY(0); } 100% { opacity: 0; transform: translateY(-14px); } }

    .hud-icon-btn {
      width: 32px; height: 32px; flex: 0 0 auto; border: 1px solid var(--muted);
      border-radius: var(--radius); background: var(--bg-darker);
      display: flex; align-items: center; justify-content: center;
      font-family: var(--font-ui); font-size: 12px; color: var(--fg-dim);
    }
    .hud-icon-btn.is-on { border-color: var(--accent); color: var(--accent); }

    /* Deadline ("Rent") Bar */
    .deadline-row {
      display: flex; align-items: center; gap: 8px;
      font-family: var(--font-ui); font-size: 11px;
    }
    .deadline-label { color: var(--fg-dim); white-space: nowrap; }
    .deadline-label strong { color: var(--accent); }
    .deadline-track {
      flex: 1; height: 7px; border: 1px solid var(--muted); border-radius: 1px;
      background: var(--bg-darker); display: flex; gap: 2px; padding: 1px;
    }
    .dl-pip { flex: 1; background: rgba(61, 51, 44, 0.55); transition: background 220ms ease; }
    .dl-pip.filled { background: var(--accent); }
    .dl-pip.danger { background: var(--danger); }
    .deadline-num { color: var(--fg-bright); font-weight: 700; min-width: 28px; text-align: right; }
    .deadline-row.is-urgent .deadline-label strong,
    .deadline-row.is-urgent .deadline-num { color: var(--danger); }

    /* Stream */
    .stream {
      flex: 1 1 auto; min-height: 0; overflow-y: auto;
      padding: 12px 12px 24px; display: flex; flex-direction: column; gap: 11px;
      -webkit-overflow-scrolling: touch;
    }

    .case-divider {
      flex: 0 0 auto; display: flex; align-items: center; gap: 8px; margin: 6px 0 2px;
      font-family: var(--font-ui); font-size: 11px; color: var(--fg-dim);
    }
    .case-divider::before, .case-divider::after { content: ""; flex: 1; height: 1px; background: var(--muted); }
    .case-divider span {
      padding: 2px 8px; border: 1px solid var(--muted); border-radius: var(--radius);
      background: var(--bg-dark); color: var(--accent); font-weight: 700;
    }

    /* Frameless Background Typography for Walking / Patrol */
    .walk-block {
      flex: 0 0 auto; padding: 10px 8px 12px;
      border-top: 1px solid rgba(156, 141, 122, 0.2);
      border-bottom: 1px solid rgba(156, 141, 122, 0.14);
      font-family: var(--font-serif); font-size: 14.5px; line-height: 1.85;
      letter-spacing: 0.04em; color: var(--fg-bright);
      text-shadow: 0 1px 10px rgba(8, 6, 5, 0.98), 0 0 3px rgba(8, 6, 5, 0.96);
      animation: fadeUp 180ms ease-out both;
    }
    .walk-kicker {
      text-align: center; font-family: var(--font-ui); font-size: 10.5px;
      color: var(--teal); letter-spacing: 0.16em; margin-bottom: 6px;
    }
    .walk-clues {
      display: flex; flex-wrap: wrap; gap: 6px; margin-top: 9px;
    }
    .clue-chip {
      font-family: var(--font-ui); font-size: 11px; color: var(--teal);
      padding: 2px 7px; border: 1px dashed rgba(90, 166, 160, 0.6);
      background: rgba(10, 8, 7, 0.65); border-radius: var(--radius);
    }

    /* Dialogue Boxes (Sharp contrast with frameless walk blocks) */
    .msg-row {
      flex: 0 0 auto; display: flex; flex-direction: column; width: 100%;
      animation: fadeUp 140ms ease-out both;
    }
    .msg-row.left { align-items: flex-start; }
    .msg-row.right { align-items: flex-end; }
    .msg-box {
      max-width: 89%; padding: 9px 11px; border: 1px solid var(--muted);
      border-radius: var(--radius); background: rgba(34, 28, 24, 0.94);
      font-size: 14.5px; line-height: 1.6;
    }
    .msg-row.left .msg-box { border-left: 2px solid var(--accent); }
    .msg-row.right .msg-box {
      max-width: 86%; background: rgba(46, 36, 29, 0.95);
      border-right: 2px solid var(--accent); color: var(--fg-bright);
    }
    .msg-head {
      display: flex; align-items: center; gap: 6px; margin-bottom: 4px;
      font-family: var(--font-ui); font-size: 11px;
    }
    .msg-spk { font-weight: 700; color: var(--fg-bright); }
    .msg-role { color: var(--fg-dim); font-size: 10.5px; }

    /* Typewriter character pop */
    .char-pop {
      display: inline-block; white-space: pre-wrap;
      animation: charPop 145ms cubic-bezier(0.22, 1.35, 0.36, 1) both;
    }
    .char-pop.emph { color: var(--accent); font-weight: 700; animation: charEmph 175ms cubic-bezier(0.2, 1.45, 0.32, 1) both; }
    @keyframes charPop { 0% { opacity: 0; transform: translateY(5px) scale(0.86); } 65% { opacity: 1; transform: translateY(-1.5px) scale(1.06); } 100% { opacity: 1; transform: translateY(0) scale(1); } }
    @keyframes charEmph { 0% { opacity: 0; transform: translateY(6px) scale(0.82); } 60% { opacity: 1; transform: translateY(-2px) scale(1.12); } 100% { opacity: 1; transform: translateY(0) scale(1); } }
    @keyframes fadeUp { from { opacity: 0; transform: translateY(7px); } to { opacity: 1; transform: translateY(0); } }

    /* Counter Case Desk Card (Papers Please style contradiction check + Stamp) */
    .case-card {
      flex: 0 0 auto; position: relative; border: 1px solid var(--muted);
      border-top: 2px solid var(--warn); border-radius: var(--radius);
      background: rgba(15, 12, 11, 0.96); overflow: hidden;
      animation: fadeUp 160ms ease-out both;
    }
    .case-head {
      padding: 8px 11px; background: var(--bg-darker); border-bottom: 1px solid var(--muted);
      display: flex; justify-content: space-between; align-items: center;
      font-family: var(--font-ui); font-size: 11px;
    }
    .case-title { color: var(--warn); font-weight: 700; }
    .case-status { color: var(--fg-dim); }
    .case-body { padding: 11px; display: flex; flex-direction: column; gap: 8px; }
    .case-hint { margin: 0; font-size: 12.5px; color: var(--fg-dim); }

    .claim-item {
      border: 1px solid var(--muted); border-radius: var(--radius);
      background: var(--bg-light); overflow: hidden;
    }
    .claim-item.is-exposed { border-color: var(--danger); }
    .claim-btn {
      width: 100%; text-align: left; padding: 9px 10px;
      display: flex; justify-content: space-between; align-items: flex-start; gap: 8px;
      font-size: 13.5px; color: var(--fg-bright); line-height: 1.5;
    }
    .claim-badge {
      flex: 0 0 auto; padding: 1px 6px; border: 1px solid var(--warn);
      border-radius: 1px; font-family: var(--font-ui); font-size: 10px; color: var(--warn);
    }
    .claim-item.is-exposed .claim-badge {
      border-color: var(--danger); color: var(--danger); background: rgba(224, 79, 95, 0.14);
    }
    .claim-proof {
      padding: 8px 10px; border-top: 1px dashed var(--muted);
      background: rgba(10, 8, 7, 0.88); font-size: 12.5px; line-height: 1.55; color: var(--teal);
    }
    .claim-proof strong { color: var(--danger); }

    /* Three Physical Stamp Options */
    .stamp-deck {
      margin-top: 4px; display: flex; flex-direction: column; gap: 7px;
    }
    .stamp-deck.is-locked { opacity: 0.45; pointer-events: none; }
    .stamp-btn {
      width: 100%; text-align: left; padding: 9px 11px;
      border: 1px solid var(--muted); border-left: 3px solid var(--muted);
      border-radius: var(--radius); background: var(--bg-darker);
      transition: transform 80ms ease, border-color 120ms ease;
    }
    .stamp-btn:active { transform: translateY(1px); }
    .stamp-btn.kind-approve { border-left-color: var(--fg-dim); }
    .stamp-btn.kind-reject { border-left-color: var(--teal); }
    .stamp-btn.kind-dirty {
      border-color: rgba(232, 111, 58, 0.65); border-left: 3px solid var(--accent);
      background: rgba(232, 111, 58, 0.09);
    }
    .stamp-top { display: flex; justify-content: space-between; align-items: center; gap: 6px; }
    .stamp-name { font-size: 14px; font-weight: 700; color: var(--fg-bright); }
    .stamp-btn.kind-dirty .stamp-name { color: var(--accent); }
    .stamp-cost { font-family: var(--font-ui); font-size: 10.5px; color: var(--fg-dim); }
    .stamp-desc { margin-top: 3px; font-size: 12px; color: var(--fg); line-height: 1.45; }
    .stamp-interest {
      margin-top: 3px; font-family: var(--font-ui); font-size: 10.5px; color: var(--warn);
    }

    /* Slammed Vermilion Stamp Overlay */
    .stamp-mark {
      position: absolute; right: 12px; top: 38px;
      padding: 4px 10px; border: 2px solid var(--danger); color: var(--danger);
      font-family: var(--font-serif); font-size: 16px; font-weight: 900;
      letter-spacing: 0.14em; transform: rotate(-10deg) scale(1);
      background: rgba(15, 12, 11, 0.82); pointer-events: none;
      animation: stampSlam 200ms cubic-bezier(0.15, 1.4, 0.3, 1) both;
    }
    .stamp-mark.is-dirty { border-color: var(--accent); color: var(--accent); }
    .stamp-mark.is-reject { border-color: var(--teal); color: var(--teal); }
    @keyframes stampSlam {
      0% { opacity: 0; transform: rotate(-16deg) scale(2.1); }
      75% { opacity: 1; transform: rotate(-9deg) scale(0.94); }
      100% { opacity: 1; transform: rotate(-10deg) scale(1); }
    }

    /* Settlement / Warning Strip */
    .strip {
      flex: 0 0 auto; padding: 7px 10px; border: 1px solid var(--muted);
      border-left: 3px solid var(--accent); border-radius: var(--radius);
      background: rgba(15, 12, 11, 0.92); font-size: 12.5px;
      display: flex; flex-wrap: wrap; align-items: center; gap: 6px;
    }
    .strip.is-warn { border-color: var(--warn); border-left-color: var(--warn); background: rgba(217, 168, 78, 0.12); }
    .strip.is-danger { border-color: var(--danger); border-left-color: var(--danger); background: rgba(224, 79, 95, 0.14); }
    .strip-badge {
      font-family: var(--font-ui); font-size: 11px; font-weight: 700;
      padding: 1px 6px; border: 1px solid var(--accent); color: var(--accent);
    }
    .strip.is-warn .strip-badge { border-color: var(--warn); color: var(--warn); }
    .strip.is-danger .strip-badge { border-color: var(--danger); color: var(--danger); }

    /* Ending & LLM Critique Card */
    .ending-card {
      flex: 0 0 auto; border: 1px solid var(--muted); border-top: 2px solid var(--accent);
      border-radius: var(--radius); background: rgba(15, 12, 11, 0.96); overflow: hidden;
    }
    .ending-hero { padding: 15px 14px; background: var(--bg-darker); border-bottom: 1px solid var(--muted); }
    .ending-badge {
      display: inline-block; padding: 2px 7px; border: 1px solid var(--accent);
      font-family: var(--font-ui); font-size: 11px; color: var(--accent); margin-bottom: 7px;
    }
    .ending-title { margin: 0; font-size: 19px; color: var(--fg-bright); }
    .ending-sub { margin-top: 4px; font-size: 12.5px; color: var(--fg-dim); }
    .ending-sec { padding: 12px 14px; border-bottom: 1px solid var(--muted); }
    .ending-sec:last-child { border-bottom: none; }
    .sec-kicker { font-family: var(--font-ui); font-size: 10.5px; color: var(--fg-dim); margin-bottom: 7px; letter-spacing: 0.06em; }
    .build-box {
      padding: 10px 12px; border: 1px solid var(--accent); border-radius: var(--radius);
      background: var(--selection);
    }
    .build-name { font-size: 16px; font-weight: 700; color: var(--fg-bright); }
    .build-quote { margin-top: 4px; font-size: 13px; color: var(--accent); font-family: var(--font-serif); }
    .interest-item {
      padding: 8px 10px; margin-bottom: 6px; border-left: 2px solid var(--danger);
      background: var(--bg); font-size: 13px; line-height: 1.55;
    }
    .interest-item.good { border-left-color: var(--ok); }
    .llm-diag {
      padding: 9px 11px; border: 1px solid var(--muted); border-left: 3px solid var(--teal);
      background: var(--bg); font-size: 13px; line-height: 1.65; margin-bottom: 8px;
    }
    .llm-details { border: 1px solid var(--muted); background: var(--bg-darker); margin-bottom: 8px; }
    .llm-details summary { padding: 7px 10px; font-family: var(--font-ui); font-size: 11px; color: var(--fg-dim); cursor: pointer; }
    .llm-pre {
      margin: 0; padding: 9px 10px; border-top: 1px solid var(--muted);
      font-family: var(--font-ui); font-size: 11px; line-height: 1.5; color: var(--fg);
      white-space: pre-wrap; max-height: 200px; overflow-y: auto; user-select: text;
    }
    .btn-copy {
      width: 100%; padding: 9px 12px; border: 1px solid var(--teal);
      background: rgba(90, 166, 160, 0.14); color: var(--fg-bright);
      font-family: var(--font-ui); font-size: 12px; font-weight: 700; border-radius: var(--radius);
    }
    .btn-copy.is-copied { border-color: var(--ok); color: var(--ok); background: rgba(127, 176, 105, 0.15); }

    /* Easter Egg: BGM Speed-Up Reveal Slider */
    .egg-box {
      padding: 10px 12px; border: 1px dashed rgba(232, 111, 58, 0.6);
      border-radius: var(--radius); background: rgba(232, 111, 58, 0.06);
    }
    .egg-top { display: flex; justify-content: space-between; align-items: center; font-family: var(--font-ui); font-size: 11.5px; margin-bottom: 8px; }
    .egg-val { color: var(--accent); font-weight: 700; }
    .egg-slider { width: 100%; accent-color: var(--accent); cursor: pointer; }

  <script>
  (function () {
    "use strict";

    /* ======================================================================
       1. Audio & Haptics Engine (Gapless AudioBufferSourceNode + Foley)
       ====================================================================== */
    const AudioEngine = (function () {
      let ctx = null, master = null, bgmGain = null, sfxGain = null;
      let bgmBuf = null, origBuf = null, bgmNode = null, bgmLoading = false, origLoading = false, bgmEl = null;
      let enabled = false, mood = "calm", eggSpeed = 1, activeTrack = "slow";

      function vib(p) {
        try {
          if (navigator.userActivation && !navigator.userActivation.hasBeenActive) return;
          if (navigator.vibrate) navigator.vibrate(p);
        } catch (e) {}
      }

      function ensureCtx() {
        if (ctx) { if (ctx.state === "suspended") ctx.resume().catch(() => {}); return true; }
        const AC = window.AudioContext || window.webkitAudioContext;
        if (!AC) return false;
        ctx = new AC();
        master = ctx.createGain(); master.gain.value = enabled ? 0.9 : 0; master.connect(ctx.destination);
        bgmGain = ctx.createGain(); bgmGain.gain.value = 0.45; bgmGain.connect(master);
        sfxGain = ctx.createGain(); sfxGain.gain.value = 0.72; sfxGain.connect(master);
        return true;
      }

      function startBuf(which) {
        if (!ctx || !enabled) return;
        const targetBuf = which === "orig" ? origBuf : bgmBuf;
        if (!targetBuf) return;
        stopBgm();
        const n = ctx.createBufferSource();
        n.buffer = targetBuf; n.loop = true;
        const rate = which === "orig"
          ? Math.max(0.75, Math.min(1.05, eggSpeed / 8))
          : (eggSpeed > 1 ? Math.min(2.8, 1 + (eggSpeed - 1) * 0.42) : (mood === "fire" ? 0.9 : 1.0));
        n.playbackRate.setValueAtTime(rate, ctx.currentTime);
        n.connect(bgmGain); n.start(0);
        bgmNode = n;
        activeTrack = which;
      }

      function loadOrigAndPlay() {
        if (!ensureCtx()) return;
        if (origBuf) { startBuf("orig"); return; }
        if (origLoading || location.protocol === "file:" || !window.fetch) {
          startBuf("slow");
          return;
        }
        origLoading = true;
        fetch("./bgm-red-cliffs-orig.mp3")
          .then(r => r.arrayBuffer())
          .then(ab => ctx.decodeAudioData(ab))
          .then(buf => { origLoading = false; origBuf = buf; if (enabled && eggSpeed >= 6) startBuf("orig"); })
          .catch(() => { origLoading = false; });
      }

      function setEggSpeed(mult) {
        eggSpeed = Math.max(1, Math.min(8, Number(mult) || 1));
        if (!enabled) {
          enabled = true;
          ensureCtx();
          master.gain.setTargetAtTime(0.9, ctx.currentTime, 0.04);
        }
        if (eggSpeed >= 6) {
          if (activeTrack === "orig" && bgmNode && ctx) {
            bgmNode.playbackRate.setTargetAtTime(Math.max(0.75, eggSpeed / 8), ctx.currentTime, 0.12);
          } else {
            loadOrigAndPlay();
          }
        } else {
          if (activeTrack === "slow" && bgmNode && ctx) {
            const rate = eggSpeed > 1 ? Math.min(2.8, 1 + (eggSpeed - 1) * 0.42) : (mood === "fire" ? 0.9 : 1.0);
            bgmNode.playbackRate.setTargetAtTime(rate, ctx.currentTime, 0.12);
          } else if (bgmBuf) {
            startBuf("slow");
          } else {
            startBgm();
          }
        }
      }

      function startBgm() {
        if (!enabled || !ensureCtx()) return;
        if (bgmBuf) { startBuf("slow"); return; }
        if (bgmLoading) return;
        if (location.protocol === "file:" || !window.fetch) {
          if (!bgmEl) {
            bgmEl = new Audio("./bgm-red-cliffs.mp3");
            bgmEl.loop = true; bgmEl.volume = 0.44;
            bgmEl.addEventListener("ended", () => { if (enabled) { bgmEl.currentTime = 0; bgmEl.play().catch(() => {}); } });
          }
          bgmEl.play().catch(() => {});
          return;
        }
        bgmLoading = true;
        fetch("./bgm-red-cliffs.mp3")
          .then(r => r.arrayBuffer())
          .then(ab => ctx.decodeAudioData(ab))
          .then(buf => { bgmLoading = false; bgmBuf = buf; if (enabled && !document.hidden) startBuf(eggSpeed >= 6 && origBuf ? "orig" : "slow"); })
          .catch(() => { bgmLoading = false; });
      }

      function stopBgm() {
        if (bgmNode) { try { bgmNode.stop(); bgmNode.disconnect(); } catch (e) {} bgmNode = null; }
        if (bgmEl) { try { bgmEl.pause(); } catch (e) {} }
      }

      function playTick(emph) {
        if (!enabled || !ensureCtx()) return;
        const now = ctx.currentTime;
        const o = ctx.createOscillator(), g = ctx.createGain();
        o.type = "triangle";
        const f = emph ? 320 : 600 + Math.random() * 140;
        o.frequency.setValueAtTime(f, now);
        o.frequency.exponentialRampToValueAtTime(f * 0.46, now + 0.02);
        g.gain.setValueAtTime(0.001, now);
        g.gain.linearRampToValueAtTime(emph ? 0.13 : 0.05, now + 0.002);
        g.gain.exponentialRampToValueAtTime(0.0005, now + 0.024);
        o.connect(g); g.connect(sfxGain); o.start(now); o.stop(now + 0.028);
      }

      function playExpose() {
        vib(10);
        if (!enabled || !ensureCtx()) return;
        const now = ctx.currentTime;
        const o = ctx.createOscillator(), g = ctx.createGain();
        o.type = "sine"; o.frequency.setValueAtTime(587.33, now);
        o.frequency.exponentialRampToValueAtTime(880, now + 0.08);
        g.gain.setValueAtTime(0.001, now);
        g.gain.linearRampToValueAtTime(0.16, now + 0.008);
        g.gain.exponentialRampToValueAtTime(0.0008, now + 0.2);
        o.connect(g); g.connect(sfxGain); o.start(now); o.stop(now + 0.22);
      }

      function playStamp(isDirty) {
        vib(isDirty ? [20, 26, 18] : 15);
        if (!enabled || !ensureCtx()) return;
        const now = ctx.currentTime;
        const o = ctx.createOscillator(), g = ctx.createGain();
        o.type = "triangle";
        o.frequency.setValueAtTime(isDirty ? 160 : 220, now);
        o.frequency.exponentialRampToValueAtTime(52, now + 0.16);
        g.gain.setValueAtTime(0.001, now);
        g.gain.linearRampToValueAtTime(0.38, now + 0.006);
        g.gain.exponentialRampToValueAtTime(0.001, now + 0.2);
        o.connect(g); g.connect(sfxGain); o.start(now); o.stop(now + 0.22);
      }

      function playAlert() {
        vib([18, 30, 24]);
        if (!enabled || !ensureCtx()) return;
        const now = ctx.currentTime;
        const o = ctx.createOscillator(), g = ctx.createGain();
        o.type = "sine"; o.frequency.setValueAtTime(112, now);
        o.frequency.exponentialRampToValueAtTime(44, now + 0.35);
        g.gain.setValueAtTime(0.001, now);
        g.gain.linearRampToValueAtTime(0.42, now + 0.01);
        g.gain.exponentialRampToValueAtTime(0.0008, now + 0.42);
        o.connect(g); g.connect(sfxGain); o.start(now); o.stop(now + 0.45);
      }

      document.addEventListener("visibilitychange", () => {
        if (document.hidden) stopBgm();
        else if (enabled) startBgm();
      });

      return {
        toggle() {
          enabled = !enabled;
          if (enabled) { ensureCtx(); master.gain.setTargetAtTime(0.9, ctx.currentTime, 0.04); startBgm(); }
          else { stopBgm(); if (ctx) master.gain.setTargetAtTime(0, ctx.currentTime, 0.04); }
          return enabled;
        },
        isEnabled: () => enabled,
        setMood(m) {
          mood = m || "calm";
          if (ctx && bgmNode && activeTrack === "slow" && eggSpeed === 1) {
            bgmNode.playbackRate.setTargetAtTime(mood === "fire" ? 0.9 : 1.0, ctx.currentTime, 0.4);
          }
        },
        setEggSpeed,
        resetEggSpeed() { eggSpeed = 1; if (enabled && bgmBuf && activeTrack !== "slow") startBuf("slow"); },
        vib, playTick, playExpose, playStamp, playAlert
      };
    })();

    /* ======================================================================
       3. Engine State & Rendering
       ====================================================================== */
    const RES_INFO = {
      coin: { name: "钱帛", max: 5, warn: 1, desc: "归零即「府库告罄」：赏格断供、降将连夜翻脸，大营从账房里散架。" },
      grain: { name: "粮草", max: 5, warn: 1, desc: "归零即「断炊绝粮」：寒冬腊月三军断炊，夜半营啸自溃。" },
      troops: { name: "兵力", max: 6, warn: 1, desc: "归零即「兵力折尽」：点卯册只剩空名，连亲卫都凑不齐。" }
    };

    let state = null;
    let queue = [];
    let activeTW = null;
    let waitingCase = false;

    const elShell = document.getElementById("app-shell");
    const elSplash = document.getElementById("splash");
    const elStream = document.getElementById("stream");
    const elTapBtn = document.getElementById("tap-btn");
    const elTapLeft = document.getElementById("tap-left");
    const elTapRight = document.getElementById("tap-right");
    const elBtnAudio = document.getElementById("btn-audio");
    const elSplashAudio = document.getElementById("btn-splash-audio");
    const elDlRow = document.getElementById("deadline-row");
    const elDlTrack = document.getElementById("deadline-track");
    const elDlNum = document.getElementById("deadline-num");
    const elModal = document.getElementById("modal-bg");

    function freshState() {
      return {
        res: { coin: 3, grain: 3, troops: 4 },
        deadline: 1,
        maxDeadline: 6,
        caseIdx: 0,
        flags: {},
        dirtyTricks: [],
        choiceLog: [],
        warned: {},
        finished: false
      };
    }

    function esc(s) {
      return String(s == null ? "" : s)
        .replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;").replace(/"/g, "&quot;");
    }

    function fmtBold(s) {
      return esc(s).replace(/\*\*([^*\n]+)\*\*/g, '<strong class="emph-txt">$1</strong>');
    }

    function scrollBottom() {
      requestAnimationFrame(() => { elStream.scrollTop = elStream.scrollHeight; });
    }

    function renderHud(deltas) {
      ["coin", "grain", "troops"].forEach(k => {
        const box = document.querySelector(`.res-box[data-res="${k}"]`);
        const info = RES_INFO[k];
        const v = state.res[k];
        const crit = v <= 0;
        const warn = !crit && v <= info.warn;
        box.classList.toggle("is-warn", warn);
        box.classList.toggle("is-crit", crit);

        box.querySelector(".res-val").textContent = v;
        const nameEl = box.querySelector(".res-name");
        nameEl.innerHTML = info.name + (crit ? '<span class="res-tag">红线</span>' : (warn ? '<span class="res-tag">告急</span>' : ""));

        const bars = box.querySelector(".res-bars");
        let h = "";
        for (let i = 0; i < info.max; i++) h += `<span class="res-seg${i < v ? " on" : ""}"></span>`;
        bars.innerHTML = h;

        if (deltas && typeof deltas[k] === "number" && deltas[k] !== 0) {
          const pop = document.createElement("span");
          pop.className = "delta-pop " + (deltas[k] > 0 ? "pos" : "neg");
          pop.textContent = (deltas[k] > 0 ? "+" : "") + deltas[k];
          box.appendChild(pop);
          setTimeout(() => pop.remove(), 1100);
        }
      });

      // Deadline ("Rent") bar
      elDlNum.textContent = `${state.deadline}/${state.maxDeadline}`;
      elDlRow.classList.toggle("is-urgent", state.deadline >= 4);
      let pips = "";
      for (let i = 0; i < state.maxDeadline; i++) {
        const cls = i < state.deadline ? (state.deadline >= 4 ? "dl-pip danger" : "dl-pip filled") : "dl-pip";
        pips += `<span class="${cls}"></span>`;
      }
      elDlTrack.innerHTML = pips;
    }

    function finishTW() {
      if (activeTW) { const t = activeTW; activeTW = null; t.finish(); return true; }
      return false;
    }

    function typewrite(el, html, onDone) {
      finishTW();
      const tmp = document.createElement("div");
      tmp.innerHTML = html;
      const steps = [];
      function walk(node, target, emph) {
        if (node.nodeType === 3) {
          for (const ch of Array.from(node.nodeValue || "")) steps.push({ k: "c", ch, emph, target });
        } else if (node.nodeType === 1) {
          const cl = node.cloneNode(false);
          steps.push({ k: "o", el: cl, target });
          for (const child of node.childNodes) walk(child, cl, emph || node.tagName === "STRONG");
        }
      }
      for (const child of tmp.childNodes) walk(child, el, false);

      el.innerHTML = "";
      let i = 0, timer = null, done = false, prev = "", cnt = 0;

      function complete(instant) {
        if (done) return;
        done = true;
        if (timer) clearTimeout(timer);
        if (activeTW && activeTW.id === id) activeTW = null;
        if (instant) el.innerHTML = html;
        scrollBottom();
        if (onDone) onDone();
      }

      function step() {
        if (done) return;
        if (i >= steps.length) { complete(false); return; }
        const s = steps[i++];
        if (s.k === "o") { s.target.appendChild(s.el); step(); return; }
        const sp = document.createElement("span");
        sp.className = s.emph ? "char-pop emph" : "char-pop";
        sp.textContent = s.ch;
        s.target.appendChild(sp);
        cnt++;
        if (s.emph) { AudioEngine.playTick(true); if (cnt % 2 === 1) AudioEngine.vib(5); }
        else if (cnt % 2 === 0 && !/\s/.test(s.ch)) AudioEngine.playTick(false);
        if (s.ch === "！" || s.ch === "？") AudioEngine.vib(6);

        let d = s.emph ? 34 : 22;
        if ("，、；：".includes(s.ch)) d += 95;
        else if ("。！？".includes(s.ch)) d += 150;
        else if (s.ch === "—" && prev === "—") d += 190;
        prev = s.ch;
        if (cnt % 8 === 0) scrollBottom();
        timer = setTimeout(step, d);
      }

      const id = Math.random();
      activeTW = { id, finish: () => complete(true) };
      step();
    }

    function updateTapBar() {
      if (waitingCase || state.finished) { elTapBtn.classList.add("hidden"); return; }
      if (activeTW) {
        elTapBtn.classList.remove("hidden");
        elTapLeft.textContent = "轻触快显本句";
        elTapRight.textContent = "跳字中…";
        return;
      }
      if (queue.length > 0) {
        elTapBtn.classList.remove("hidden");
        elTapLeft.textContent = "点击继续";
        const rem = queue.filter(x => x.kind !== "cb").length;
        elTapRight.textContent = rem > 0 ? `剩余 ${rem} 条` : "进入案卷";
      } else {
        elTapBtn.classList.add("hidden");
      }
    }

    function addStrip(badge, text, kind) {
      const d = document.createElement("div");
      d.className = "strip" + (kind ? " " + kind : "");
      d.innerHTML = `<span class="strip-badge">${esc(badge)}</span><span>${esc(text)}</span>`;
      elStream.appendChild(d);
      scrollBottom();
    }

    function applyEffects(eff, label) {
      const deltas = {};
      const parts = [];
      ["coin", "grain", "troops"].forEach(k => {
        if (typeof eff[k] === "number" && eff[k] !== 0) {
          state.res[k] = Math.max(0, Math.min(RES_INFO[k].max, state.res[k] + eff[k]));
          deltas[k] = eff[k];
          parts.push(`${RES_INFO[k].name} ${eff[k] > 0 ? "+" : ""}${eff[k]}`);
        }
      });
      if (typeof eff.deadline === "number" && eff.deadline !== 0) {
        state.deadline = Math.max(0, Math.min(state.maxDeadline, state.deadline + eff.deadline));
        parts.push(`江东死线 ${eff.deadline > 0 ? "+" : ""}${eff.deadline}`);
      }
      renderHud(deltas);
      addStrip(parts.join(" · ") || "已批示", label, eff.deadline >= 2 ? "is-warn" : "");

      // Check red-line collapse on blood bars
      const zeros = ["coin", "grain", "troops"].filter(k => state.res[k] <= 0);
      if (zeros.length > 0) {
        AudioEngine.playAlert();
        const names = zeros.map(k => RES_INFO[k].name).join("、");
        addStrip("⚠ 红线崩盘", `${names}已归零！大营支撑不住，本局直接结束。`, "is-danger");
        renderEnding({ type: "collapse", zeros });
        return true;
      }

      // Warn on low blood bars
      ["coin", "grain", "troops"].forEach(k => {
        if (state.res[k] <= RES_INFO[k].warn && !state.warned[k]) {
          state.warned[k] = true;
          AudioEngine.playAlert();
          addStrip(`⚠ ${RES_INFO[k].name}告急`, RES_INFO[k].desc, "is-warn");
        }
      });

      // Check deadline explosion ("Rent due!")
      if (state.deadline >= state.maxDeadline) {
        AudioEngine.playAlert();
        addStrip("⚠ 死线已满 6/6", "江东主战派彻底定计！周瑜抢先发难，你失去了全部先手。", "is-danger");
        renderEnding({ type: "deadline" });
        return true;
      }

      if (state.deadline >= 4 && !state.warned.deadline) {
        state.warned.deadline = true;
        AudioEngine.playAlert();
        addStrip("⚠ 柴桑催命", "江东定战死线已达 4/6！再拖延下去，不等你查完账周瑜就先动手了。", "is-warn");
      }

      return false;
    }

    function renderCaseCard(c) {
      waitingCase = true;
      updateTapBar();

      const card = document.createElement("div");
      card.className = "case-card";
      const exposed = new Set();

      function draw() {
        const allExposed = exposed.size >= c.claims.length;
        let claimsHtml = "";
        c.claims.forEach((cl, idx) => {
          const isExp = exposed.has(idx);
          claimsHtml += `
            <div class="claim-item${isExp ? " is-exposed" : ""}">
              <button type="button" class="claim-btn" data-cidx="${idx}">
                <span>${esc(cl.surface)}</span>
                <span class="claim-badge">${isExp ? "已打脸" : "核对证物"}</span>
              </button>
              ${isExp ? `<div class="claim-proof"><strong>【巡营打脸】</strong>${esc(cl.proof)}</div>` : ""}
            </div>`;
        });

        let stampsHtml = "";
        c.stamps.forEach((st, idx) => {
          stampsHtml += `
            <button type="button" class="stamp-btn kind-${st.kind}" data-sidx="${idx}">
              <div class="stamp-top">
                <span class="stamp-name">${esc(st.label)}</span>
                <span class="stamp-cost">${esc(st.costText)}</span>
              </div>
              <div class="stamp-desc">${esc(st.desc)}</div>
              <div class="stamp-interest">${esc(st.interest)}</div>
            </button>`;
        });

        card.innerHTML = `
          <div class="case-head">
            <span class="case-title">[柜台案卷] ${esc(c.docTitle)}</span>
            <span class="case-status">已戳穿 ${exposed.size}/${c.claims.length} 处矛盾</span>
          </div>
          <div class="case-body">
            <p class="case-hint">${allExposed ? "矛盾已全部戳穿——请拿起丞相大印，拍板处置：" : "点击公文中的可疑表述，用刚才巡营亲见的证物当场打脸："}</p>
            ${claimsHtml}
            <div class="stamp-deck${allExposed ? "" : " is-locked"}">${stampsHtml}</div>
          </div>`;

        card.querySelectorAll(".claim-btn").forEach(btn => {
          btn.addEventListener("click", () => {
            const idx = Number(btn.getAttribute("data-cidx"));
            if (!exposed.has(idx)) {
              exposed.add(idx);
              AudioEngine.playExpose();
              draw();
              scrollBottom();
            }
          });
        });

        card.querySelectorAll(".stamp-btn").forEach(btn => {
          btn.addEventListener("click", () => {
            if (!allExposed) return;
            const st = c.stamps[Number(btn.getAttribute("data-sidx"))];
            AudioEngine.playStamp(st.kind === "dirty");

            // Lock card & slam vermilion stamp
            card.querySelectorAll("button").forEach(b => b.disabled = true);
            const mark = document.createElement("div");
            mark.className = "stamp-mark" + (st.kind === "dirty" ? " is-dirty" : (st.kind === "reject" ? " is-reject" : ""));
            mark.textContent = st.stampText;
            card.appendChild(mark);

            state.flags[st.flag.key] = st.flag.val;
            if (st.flag.dirty) state.dirtyTricks.push(st.flag.dirty);
            state.choiceLog.push({ caseNum: c.num, title: c.title, stamp: st.stampText, kind: st.kind, label: st.label });

            // Post Cao Cao's spoken reply
            const row = document.createElement("div");
            row.className = "msg-row right";
            row.innerHTML = `<div class="msg-box"><div class="msg-head"><span class="msg-spk">曹操</span><span class="msg-role">拍板盖印</span></div><div>${fmtBold(st.reply)}</div></div>`;
            elStream.appendChild(row);

            waitingCase = false;
            const ended = applyEffects(st.effects, st.label);
            if (ended) return;

            state.caseIdx++;
            if (state.caseIdx < CASES.length) {
              queue.push({ kind: "cb", fn: () => runCase(state.caseIdx) });
              updateTapBar();
            } else {
              queue.push({ kind: "cb", fn: () => renderEnding({ type: "complete" }) });
              updateTapBar();
            }
            scrollBottom();
          });
        });
      }

      draw();
      elStream.appendChild(card);
      scrollBottom();
    }

    function runCase(idx) {
      const c = CASES[idx];
      elShell.setAttribute("data-mood", c.mood);
      AudioEngine.setMood(c.mood);

      const div = document.createElement("div");
      div.className = "case-divider";
      div.innerHTML = `<span>${c.num} · ${c.title}</span>`;
      elStream.appendChild(div);

      queue = [];
      queue.push({ kind: "walk", data: c.walk });
      c.introMsgs.forEach(m => queue.push({ kind: "msg", data: m }));
      queue.push({ kind: "cb", fn: () => renderCaseCard(c) });

      advance();
    }

    function advance() {
      if (waitingCase || state.finished) return;
      if (finishTW()) { updateTapBar(); return; }
      if (queue.length === 0) { updateTapBar(); return; }

      const item = queue.shift();
      if (item.kind === "cb") { item.fn(); return; }

      if (item.kind === "walk") {
        AudioEngine.playTick(false);
        const w = document.createElement("div");
        w.className = "walk-block";
        w.innerHTML = `<div class="walk-kicker">— ${esc(item.data.kicker)} —</div><div class="walk-text"></div>`;
        elStream.appendChild(w);
        const textEl = w.querySelector(".walk-text");
        typewrite(textEl, fmtBold(item.data.text), () => {
          const cluesWrap = document.createElement("div");
          cluesWrap.className = "walk-clues";
          item.data.clues.forEach(cl => {
            const sp = document.createElement("span");
            sp.className = "clue-chip";
            sp.textContent = cl;
            cluesWrap.appendChild(sp);
          });
          w.appendChild(cluesWrap);
          scrollBottom();
          updateTapBar();
        });
        updateTapBar();
        return;
      }

      if (item.kind === "msg") {
        AudioEngine.playTick(false);
        const row = document.createElement("div");
        row.className = "msg-row " + item.data.side;
        row.innerHTML = `<div class="msg-box"><div class="msg-head"><span class="msg-spk">${esc(item.data.speaker)}</span><span class="msg-role">${esc(item.data.role)}</span></div><div class="msg-body"></div></div>`;
        elStream.appendChild(row);
        typewrite(row.querySelector(".msg-body"), fmtBold(item.data.text), () => {
          if (queue.length > 0 && queue[0].kind === "cb") {
            const cb = queue.shift();
            cb.fn();
            return;
          }
          updateTapBar();
        });
        updateTapBar();
      }
    }

    /* ======================================================================
       4. Reckoning ("高利贷利息结算") + Shareable Build + LLM Review Prompt
       ====================================================================== */
    function renderEnding(info) {
      state.finished = true;
      waitingCase = false;
      queue = [];
      finishTW();
      updateTapBar();
      elShell.setAttribute("data-mood", "fire");
      AudioEngine.setMood("fire");

      const dirtyCount = state.dirtyTricks.length;
      const f = state.flags;

      // Determine ending title + shareable build
      let badge = "", title = "", sub = "", buildName = "", buildQuote = "";
      if (info.type === "collapse") {
        badge = "红线崩盘 · 提前出局";
        title = "账本先炸了，没等到东南风";
        sub = "三项底线之一归零，江陵大营从内部瓦解。";
        buildName = "账房爆雷流 · 战术很硬但本钱花光";
        buildQuote = "「我那局光顾着算计周瑜，结果先把自家库房/粮仓算干了。」";
      } else if (info.type === "deadline") {
        badge = "死线爆表 · 痛失先手";
        title = "账还没查清，周瑜的船已经撞门了";
        sub = "江东定战死线拉满 6/6——你在江陵越求稳，南岸的火船备得越齐。";
        buildName = "清官拖死流 · 账本干干净净但输给了时间";
        buildQuote = "「我那局每笔假账都掀了桌，结果查完账抬头一看周瑜已经开火了。」";
      } else if (f.c3_mode === "approve") {
        badge = "史实灰 · 烈火乌林";
        title = "你踩中了最甜的那口诱饵";
        sub = "前两案再精明，最后一案高台迎黄盖，十艘火船顺东南风一夜烧穿水寨。";
        buildName = dirtyCount >= 1 ? "精明一世糊涂一时流" : "正史复刻流 · 曹公同款翻车";
        buildQuote = "「我那局前两案把账算得飞起，最后一刻贪了个『不战而降』直接进火海。」";
      } else if (dirtyCount >= 2) {
        badge = "曹氏枭雄 · 脏活赢麻";
        title = "治世能臣算个屁，乱世奸雄活下来了";
        sub = "靠假舰册、霉谷换新粮、借刀洗降营一路压死江东死线——赢相极丑，但你真带着主力活着走出了赤壁。";
        buildName = f.c3_mode === "dirty" ? "借刀清营流 · 拿周瑜的火烧自家降将" : "假账诈胡流 · 靠骗编制撑过柴桑";
        buildQuote = `「我那局靠【${state.dirtyTricks.join(" + ")}】硬把赤壁打成了阳谋，骂名我背，主力全归！」`;
      } else if (f.c3_mode === "dirty") {
        badge = "毒手破局 · 天下寒心";
        title = "一把借来的火，烧掉了江东也烧掉了名声";
        sub = "你放黄盖火船撞进荆州降营，北军毫发无伤——代价是从此天下无人再敢信你的「与之更始」。";
        buildName = "绝户借刀流 · 死道友不死贫道";
        buildQuote = "「我那局没拦黄盖，顺手拿他的火船帮我清理了不听话的降营。」";
      } else {
        badge = "苦撑破局 · 铁壁北归";
        title = "挨了满营骂，但火没烧起来";
        sub = "你忍着死线逼近把每颗雷都拆了——没赢下江南，也没让周瑜赚走千古名声。";
        buildName = "铁壁风控流 · 谁劝我豪赌我掀谁桌子";
        buildQuote = "「我那局顶着 5/6 死线硬扛，愣是没给黄盖留一点空子。」";
      }

      // Build delayed interest reckoning list
      const interests = [];
      if (f.c1_mode === "dirty") interests.push({ good: false, text: "【案壹利息】假舰册确实把柴桑吓住了半日，但那三十条平底货船在江面根本转不了向，荆州降将也记恨你扣了安家费。" });
      else if (f.c1_mode === "approve") interests.push({ good: false, text: "【案壹利息】照单发钱买了一时太平，开战时才发现水师编制里掺了大半条运粮平底船。" });
      else if (f.c1_mode === "reject") interests.push({ good: true, text: "【案壹回响】逐船清查虽然拖慢了节奏，但出江的十二艘斗舰条条扎实，没在紧要关头掉链子。" });

      if (f.c2_mode === "dirty") interests.push({ good: false, text: "【案贰利息】靠霉谷强换新米解了粮荒，但荆州大族暗地把你的兵力虚实全透给了刘备；疑兵船上的病卒也在江心率先溃散。" });
      else if (f.c2_mode === "approve") interests.push({ good: false, text: "【案贰利息】压进袖子里的疫报在乌林夜总算账——一半北兵连刀都拎不起来。" });
      else if (f.c2_mode === "reject") interests.push({ good: true, text: "【案贰回响】北岸隔离营稳住了大军底盘，全营咳嗽声轻了一半，没在决战夜发生瘟疫崩盘。" });

      if (f.c3_mode === "dirty") interests.push({ good: false, text: "【案叁利息】北军主力完好撤上高坡，但「卖降营挡火船」的消息一夜传遍荆襄，许昌清流弹劾的奏疏已雪片般飞来。" });
      else if (f.c3_mode === "approve") interests.push({ good: false, text: "【案叁利息】高台灯笼成了黄盖十艘火船最亮的靶心，东南风借火势一夜吞没水寨。" });
      else if (f.c3_mode === "reject") interests.push({ good: true, text: "【案叁回响】强弩营把黄盖死死卡在暗水外，十艘火船自己在江心烧成了白昼。" });

      // Local consistency diagnosis
      const modes = [f.c1_mode, f.c2_mode, f.c3_mode].filter(Boolean);
      const uniqueModes = new Set(modes);
      let diag = "";
      if (uniqueModes.size === 1 && modes.length === 3) {
        const only = modes[0];
        if (only === "dirty") diag = "<strong>【逻辑一致性 · 100% 枭雄闭环】</strong>三桩案子你一连耍了三手脏招，从骗编制、榨豪族到借刀清营，毫无心理负担——极度实用主义、结果导向，但组织信用已彻底清零。";
        else if (only === "reject") diag = "<strong>【逻辑一致性 · 100% 铁壁审计】</strong>三案全部掀桌查办，宁可顶着死线爆表也绝不妥协原则——典型的强风控性格，守得住底线，但容易被时间拖死。";
        else diag = "<strong>【逻辑一致性 · 100% 赌势头】</strong>三案全选照准/顺势，永远相信场面与气势能盖过隐患——高风险偏好，顺风无敌，逆风一波带走。";
      } else {
        diag = "<strong>【逻辑一致性 · 灵活变阵】</strong>你没有死守单一原则，而是盯着顶栏的血条与死线动态切换手腕（该查办时查办，该耍脏招时毫不手软）——典型的现实政治家/老练操盘手气质。";
      }

      const logLines = state.choiceLog.map((c, i) => `${i + 1}. [${c.caseNum} ${c.title}] 盖印【${c.stamp}】：${c.label}`).join("\n");
      const llmPrompt = [
        "你是一位毒舌、敏锐、懂《三国志》又懂职场政治的马伯庸风历史谋士。",
        "我刚玩完《曹操不容易 · V2 江陵柜台日》实验切片（机制：巡营取证 → 打脸假账 → 盖章处置，含钱粮兵三血条 + 江东定战死线 + 灰色脏招）。请点评我：",
        "",
        `【结局】${badge} — ${title}`,
        `【流派】${buildName}`,
        `【终局账本】钱帛 ${state.res.coin} / 粮草 ${state.res.grain} / 兵力 ${state.res.troops} / 江东死线 ${state.deadline}/${state.maxDeadline}`,
        `【耍过的脏招】${state.dirtyTricks.length ? state.dirtyTricks.join("；") : "无（全程没碰脏招）"}`,
        "【逐案盖章流水】",
        logLines,
        "",
        "请分三段犀利点评（300~450字，拒绝鸡汤）：",
        "1. 前后选择逻辑一致性（是首尾一贯的枭雄/清官，还是看菜下碟的机会主义者？）",
        "2. 决策性格画像（如果我在现实里带团队或做业务，会是什么风格？给一个三国人物类比）",
        "3. 最狠/最蠢的一颗印，以及如果重开怎么玩出更离谱的流派。"
      ].join("\n");

      const card = document.createElement("div");
      card.className = "ending-card";
      card.innerHTML = `
        <div class="ending-hero">
          <span class="ending-badge">${esc(badge)}</span>
          <h2 class="ending-title">${esc(title)}</h2>
          <div class="ending-sub">${esc(sub)}</div>
        </div>
        <div class="ending-sec">
          <div class="sec-kicker">// 本局可吹流派</div>
          <div class="build-box">
            <div class="build-name">${esc(buildName)}</div>
            <div class="build-quote">${esc(buildQuote)}</div>
          </div>
        </div>
        ${interests.length ? `
        <div class="ending-sec">
          <div class="sec-kicker">// 入夜利息结算（每一颗印的回响）</div>
          ${interests.map(it => `<div class="interest-item${it.good ? " good" : ""}">${esc(it.text)}</div>`).join("")}
        </div>` : ""}
        <div class="ending-sec">
          <div class="sec-kicker">// AI 谋士复盘 · 逻辑一致性与性格点评</div>
          <div class="llm-diag">${diag}</div>
          <details class="llm-details">
            <summary>展开专属 LLM 深度点评提示词（含本局脏招与盖章流水）</summary>
            <pre class="llm-pre">${esc(llmPrompt)}</pre>
          </details>
          <button type="button" class="btn-copy" id="btn-copy-llm">一键复制专属 LLM 点评提示词</button>
        </div>
        <div class="ending-sec">
          <div class="sec-kicker">// 🎧 结局彩蛋 · 拨快时光听原曲</div>
          <div class="egg-box">
            <div class="egg-top">
              <span>赤壁背景音乐 · 变速滑杆</span>
              <span class="egg-val" id="egg-val">1x（8倍慢放氛围）</span>
            </div>
            <input type="range" class="egg-slider" id="egg-slider" min="1" max="8" step="1" value="1">
            <div class="egg-presets">
              <button type="button" class="egg-preset is-on" data-spd="1">1x 慢放</button>
              <button type="button" class="egg-preset" data-spd="2">2x 加速</button>
              <button type="button" class="egg-preset" data-spd="4">4x 疾驰</button>
              <button type="button" class="egg-preset" data-spd="8">8x 原曲</button>
            </div>
            <div class="egg-note" id="egg-note">拖动滑杆或点「8x 原曲」，听听刚才伴你熬过赤壁寒夜的背景音原本是什么旋律。</div>
          </div>
        </div>
        <div class="ending-sec">
          <button type="button" class="btn-primary" id="btn-replay">再来一局（换套脏招试试）</button>
        </div>`;

      elStream.appendChild(card);

      // Wire Easter Egg BGM speed-up slider
      const eggSlider = card.querySelector("#egg-slider");
      const eggVal = card.querySelector("#egg-val");
      const eggNote = card.querySelector("#egg-note");
      const eggBtns = card.querySelectorAll(".egg-preset");

      function applyEgg(spd) {
        const v = Math.max(1, Math.min(8, Number(spd) || 1));
        eggSlider.value = String(v);
        AudioEngine.setEggSpeed(v);
        syncAudioUI();
        eggBtns.forEach(b => b.classList.toggle("is-on", Number(b.getAttribute("data-spd")) === v));
        if (v >= 8) {
          eggVal.textContent = "8x（已还原原速！）";
          eggNote.innerHTML = "<strong>彩蛋揭晓：</strong>刚才陪你在赤壁熬夜的玄墨氛围音，其实是把这段温暖的「麦田」田园流行旋律放慢 8 倍做的！";
        } else if (v >= 6) {
          eggVal.textContent = v + "x（逼近原曲…）";
          eggNote.textContent = "再往右拉一点，江雾就彻底散开、露出原本的田园吉他与电钢旋律了！";
        } else if (v > 1) {
          eggVal.textContent = v + "x（时光拨快中）";
          eggNote.textContent = "慢放的江雾正在加速苏醒……继续拉到 8x 听完整原曲！";
        } else {
          eggVal.textContent = "1x（8倍慢放氛围）";
          eggNote.textContent = "拖动滑杆或点「8x 原曲」，听听刚才伴你熬过赤壁寒夜的背景音原本是什么旋律。";
        }
      }

      eggSlider.addEventListener("input", () => applyEgg(eggSlider.value));
      eggBtns.forEach(b => b.addEventListener("click", () => {
        AudioEngine.playExpose();
        applyEgg(b.getAttribute("data-spd"));
      }));

      card.querySelector("#btn-copy-llm").addEventListener("click", function () {
        const btn = this;
        const done = () => {
          AudioEngine.playStamp(false);
          btn.classList.add("is-copied");
          btn.textContent = "已复制！粘贴给任意 AI 即可点评";
          setTimeout(() => { btn.classList.remove("is-copied"); btn.textContent = "一键复制专属 LLM 点评提示词"; }, 2400);
        };
        if (navigator.clipboard && navigator.clipboard.writeText) {
          navigator.clipboard.writeText(llmPrompt).then(done).catch(() => {});
        }
      });

      card.querySelector("#btn-replay").addEventListener("click", () => {
        AudioEngine.resetEggSpeed();
        AudioEngine.playStamp(false);
        startGame();
      });

      scrollBottom();
    }

    function startGame() {
      state = freshState();
      queue = [];
      waitingCase = false;
      finishTW();
      elSplash.classList.add("hidden");
      elStream.innerHTML = "";
      renderHud(null);
      runCase(0);
    }

    function syncAudioUI() {
      const on = AudioEngine.isEnabled();
      elBtnAudio.classList.toggle("is-on", on);
      elBtnAudio.textContent = on ? "音" : "静";
      elSplashAudio.classList.toggle("is-on", on);
      elSplashAudio.textContent = on ? "赤壁·麦田烬风8x：已开启" : "赤壁·麦田烬风8x：静音";
    }

    // Event bindings
    document.getElementById("btn-start").addEventListener("click", () => {
      AudioEngine.playStamp(false);
      startGame();
    });
    elSplashAudio.addEventListener("click", () => { AudioEngine.toggle(); syncAudioUI(); });
    elBtnAudio.addEventListener("click", () => { AudioEngine.toggle(); syncAudioUI(); });
    document.getElementById("btn-reset").addEventListener("click", () => {
      if (confirm("重开本局《江陵柜台日》？")) startGame();
    });
    elTapBtn.addEventListener("click", advance);
    elStream.addEventListener("click", e => {
      if (e.target.closest("button, details, summary, .case-card, .ending-card")) return;
      if (activeTW || queue.length > 0) advance();
    });

    // HUD resource info modal
    document.querySelectorAll(".res-box").forEach(box => {
      box.addEventListener("click", () => {
        const k = box.getAttribute("data-res");
        const info = RES_INFO[k];
        AudioEngine.playExpose();
        document.getElementById("modal-title").textContent = `${info.name} · 当前 ${state.res[k]} / ${info.max}`;
        document.getElementById("modal-body").textContent = `警戒线 ≤ ${info.warn}（亮灯报警），红线 = 0（立即崩盘）。${info.desc}`;
        elModal.classList.remove("hidden");
      });
    });
    document.getElementById("modal-close").addEventListener("click", () => elModal.classList.add("hidden"));
    elModal.addEventListener("click", e => { if (e.target === elModal) elModal.classList.add("hidden"); });

    state = freshState();
    renderHud(null);
    syncAudioUI();
  })();
  </script>
</body>
</html>
