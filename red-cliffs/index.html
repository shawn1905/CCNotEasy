<!DOCTYPE html>
<html lang="zh-CN" data-theme="tokyo-night">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <meta name="theme-color" content="#13141c">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <title>《曹操不容易》// 赤壁前夜 · 建安十三年冬</title>
  <style>
/* ==========================================================================
   《曹操不容易》 // 赤壁前夜 Mobile Demo
   Visual Bible: Omarchy Quattro / Tokyo Night (Strict, Square, Zero-Bloat)
   ========================================================================== */

:root,
[data-theme="tokyo-night"] {
  --bg: #1a1b26;
  --bg-dark: #13141c;
  --bg-darker: #0e0e14;
  --bg-light: #24283b;
  --fg: #a9b1d6;
  --fg-dim: #565f89;
  --fg-bright: #c0caf5;
  --accent: #7aa2f7;
  --selection: #292e42;
  --muted: #414868;
  --danger: #f7768e;
  --warn: #e0af68;
  --fire: #ff9e64;
  --ok: #9ece6a;
  --info: #449dab;
  --special: #ad8ee6;
  --earth: #75493d;

  --radius: 2px;
  --border: 1px solid var(--muted);
  --font-ui: "JetBrains Mono", "Sarasa Mono SC", "Noto Sans Mono CJK SC", ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace;
  --font-prose: "IBM Plex Sans", "Noto Sans SC", "PingFang SC", "Hiragino Sans GB", "Microsoft YaHei", system-ui, -apple-system, sans-serif;

  --safe-top: env(safe-area-inset-top, 0px);
  --safe-bottom: env(safe-area-inset-bottom, 0px);
}

*,
*::before,
*::after {
  box-sizing: border-box;
  -webkit-tap-highlight-color: transparent;
}

html,
body {
  margin: 0;
  padding: 0;
  height: 100%;
  background: var(--bg-darker);
  color: var(--fg);
  font-family: var(--font-prose);
  font-size: 15px;
  line-height: 1.6;
  -webkit-font-smoothing: antialiased;
  overflow: hidden;
  user-select: none;
}

button {
  font-family: inherit;
  color: inherit;
  background: none;
  border: none;
  padding: 0;
  cursor: pointer;
  touch-action: manipulation;
}

button:focus-visible {
  outline: 1px solid var(--accent);
  outline-offset: 1px;
}

/* ==========================================================================
   App Shell & Liftoff Dusk Atmosphere
   ========================================================================== */

.viewport-frame {
  width: 100%;
  height: 100dvh;
  display: flex;
  justify-content: center;
  background: var(--bg-darker);
}

.app-shell {
  position: relative;
  width: 100%;
  max-width: 460px;
  height: 100dvh;
  display: flex;
  flex-direction: column;
  background: var(--bg);
  overflow: hidden;
}

@media (min-width: 480px) {
  .app-shell {
    border-left: 1px solid var(--muted);
    border-right: 1px solid var(--muted);
  }
}

.atmosphere-bg {
  position: absolute;
  inset: 0;
  pointer-events: none;
  z-index: 0;
  transition: opacity 420ms ease, background 420ms ease;
  background:
    radial-gradient(ellipse 110% 55% at 50% 0%, rgba(122, 162, 247, 0.08) 0%, transparent 70%),
    radial-gradient(ellipse 100% 45% at 50% 100%, rgba(68, 157, 171, 0.05) 0%, transparent 70%);
}

.app-shell[data-mood="calm"] .atmosphere-bg {
  background:
    radial-gradient(ellipse 110% 55% at 50% 0%, rgba(122, 162, 247, 0.08) 0%, transparent 70%),
    radial-gradient(ellipse 100% 45% at 50% 100%, rgba(68, 157, 171, 0.05) 0%, transparent 70%);
}

.app-shell[data-mood="tense"] .atmosphere-bg {
  background:
    radial-gradient(ellipse 100% 45% at 50% 0%, rgba(122, 162, 247, 0.05) 0%, transparent 65%),
    radial-gradient(ellipse 115% 55% at 50% 100%, rgba(224, 175, 104, 0.10) 0%, transparent 72%);
}

.app-shell[data-mood="cold"] .atmosphere-bg {
  background:
    radial-gradient(ellipse 110% 60% at 50% 0%, rgba(68, 157, 171, 0.11) 0%, transparent 72%),
    radial-gradient(ellipse 100% 45% at 50% 100%, rgba(86, 95, 137, 0.09) 0%, transparent 70%);
}

.app-shell[data-mood="fire"] .atmosphere-bg {
  background:
    radial-gradient(ellipse 100% 40% at 50% 0%, rgba(247, 118, 142, 0.05) 0%, transparent 65%),
    radial-gradient(ellipse 120% 58% at 50% 100%, rgba(255, 158, 100, 0.16) 0%, rgba(247, 118, 142, 0.06) 45%, transparent 78%);
}

.ember-canvas {
  position: absolute;
  inset: 0;
  width: 100%;
  height: 100%;
  pointer-events: none;
  z-index: 1;
}

.app-layer {
  position: relative;
  z-index: 2;
  display: flex;
  flex-direction: column;
  height: 100%;
  min-height: 0;
}

.hidden {
  display: none !important;
}

/* ==========================================================================
   Splash Screen (Terminal meets Bamboo Slip)
   ========================================================================== */

.splash-screen {
  position: absolute;
  inset: 0;
  z-index: 30;
  display: flex;
  flex-direction: column;
  justify-content: center;
  padding: calc(20px + var(--safe-top)) 20px calc(24px + var(--safe-bottom));
  background:
    radial-gradient(ellipse 110% 50% at 50% 100%, rgba(255, 158, 100, 0.11) 0%, transparent 70%),
    radial-gradient(ellipse 100% 45% at 50% 0%, rgba(122, 162, 247, 0.09) 0%, transparent 65%),
    var(--bg);
}

.splash-card {
  position: relative;
  border: 1px solid var(--muted);
  border-radius: var(--radius);
  background: var(--bg-dark);
  padding: 24px 20px 20px;
}

.splash-card::before {
  content: "";
  position: absolute;
  top: 0;
  left: 0;
  right: 0;
  height: 2px;
  background: linear-gradient(90deg, var(--accent) 0%, var(--fire) 100%);
}

.splash-meta {
  display: flex;
  align-items: center;
  justify-content: space-between;
  font-family: var(--font-ui);
  font-size: 11px;
  letter-spacing: 0.06em;
  color: var(--fg-dim);
  margin-bottom: 14px;
}

.splash-era {
  color: var(--fire);
}

.splash-title {
  margin: 0;
  font-size: 26px;
  font-weight: 700;
  letter-spacing: 0.04em;
  color: var(--fg-bright);
  line-height: 1.25;
}

.splash-subtitle {
  margin: 6px 0 0;
  font-family: var(--font-ui);
  font-size: 13px;
  color: var(--accent);
}

.splash-divider {
  height: 1px;
  background: var(--muted);
  margin: 16px 0;
}

.splash-tagline {
  margin: 0;
  font-size: 15px;
  color: var(--fg-bright);
  line-height: 1.6;
}

.splash-desc {
  margin: 8px 0 0;
  font-size: 13px;
  color: var(--fg-dim);
  line-height: 1.65;
}

.splash-slips {
  display: grid;
  grid-template-columns: repeat(3, 1fr);
  gap: 8px;
  margin-top: 16px;
  padding: 10px 0 0;
  border-top: 1px dashed var(--muted);
}

.splash-slip-item {
  border-left: 2px solid var(--muted);
  padding-left: 8px;
}

.splash-slip-k {
  display: block;
  font-family: var(--font-ui);
  font-size: 10px;
  color: var(--fg-dim);
}

.splash-slip-v {
  display: block;
  font-family: var(--font-ui);
  font-size: 12px;
  color: var(--fg);
  margin-top: 2px;
}

.splash-actions {
  display: flex;
  flex-direction: column;
  gap: 10px;
  margin-top: 20px;
}

.btn-primary {
  width: 100%;
  padding: 12px 14px;
  border: 1px solid var(--accent);
  border-left: 3px solid var(--accent);
  border-radius: var(--radius);
  background: var(--selection);
  color: var(--fg-bright);
  font-family: var(--font-ui);
  font-size: 14px;
  font-weight: 600;
  letter-spacing: 0.04em;
  text-align: center;
  transition: background 120ms ease, border-color 120ms ease, transform 80ms ease;
}

.btn-primary:active {
  transform: translateY(1px);
  background: #333952;
}

.btn-secondary {
  width: 100%;
  padding: 10px 14px;
  border: 1px solid var(--muted);
  border-radius: var(--radius);
  background: var(--bg);
  color: var(--fg);
  font-family: var(--font-ui);
  font-size: 13px;
  text-align: center;
  transition: background 120ms ease, border-color 120ms ease;
}

.btn-secondary:hover,
.btn-secondary:active {
  background: var(--bg-light);
  border-color: var(--fg-dim);
}

.splash-footer {
  display: flex;
  align-items: center;
  justify-content: space-between;
  margin-top: 14px;
  font-family: var(--font-ui);
  font-size: 11px;
  color: var(--fg-dim);
}

.splash-audio-btn {
  display: inline-flex;
  align-items: center;
  gap: 6px;
  padding: 5px 9px;
  border: 1px solid var(--muted);
  border-radius: var(--radius);
  background: var(--bg);
  font-family: var(--font-ui);
  font-size: 11px;
  color: var(--fg);
}

.splash-audio-btn.is-on {
  border-color: var(--accent);
  color: var(--fg-bright);
}

/* ==========================================================================
   Sticky Top HUD (48px) & Chapter Progress Strip (22px)
   ========================================================================== */

.hud-bar {
  flex: 0 0 auto;
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 8px;
  min-height: calc(48px + var(--safe-top));
  padding: var(--safe-top) 10px 0;
  background: var(--bg-dark);
  border-bottom: 1px solid var(--muted);
}

.hud-resources {
  display: flex;
  align-items: center;
  gap: 8px;
  flex: 1;
  min-width: 0;
}

.res-gauge {
  position: relative;
  flex: 1;
  min-width: 0;
  padding: 3px 6px 4px;
  border: 1px solid rgba(65, 72, 104, 0.65);
  border-radius: var(--radius);
  background: var(--bg-darker);
}

.res-top {
  display: flex;
  align-items: baseline;
  justify-content: space-between;
  gap: 4px;
  font-family: var(--font-ui);
  line-height: 1.1;
}

.res-label {
  font-size: 10px;
  color: var(--fg-dim);
  white-space: nowrap;
}

.res-val-wrap {
  display: inline-flex;
  align-items: baseline;
  gap: 3px;
}

.res-val {
  font-size: 12px;
  font-weight: 700;
  color: var(--fg-bright);
  font-variant-numeric: tabular-nums;
}

.res-gauge.is-low .res-val {
  color: var(--danger);
}

.res-gauge.is-warn .res-val {
  color: var(--warn);
}

.res-segs {
  display: flex;
  gap: 2px;
  margin-top: 3px;
  height: 3px;
}

.res-seg {
  flex: 1;
  background: rgba(65, 72, 104, 0.45);
  border-radius: 1px;
  transition: background 180ms ease;
}

.res-gauge[data-res="coin"] .res-seg.filled {
  background: var(--earth);
}

.res-gauge[data-res="grain"] .res-seg.filled {
  background: var(--warn);
}

.res-gauge[data-res="troops"] .res-seg.filled {
  background: var(--accent);
}

.res-gauge.is-low .res-seg.filled {
  background: var(--danger) !important;
}

.fake-troop-badge {
  position: absolute;
  top: -7px;
  right: 18px;
  padding: 0 4px;
  font-family: var(--font-ui);
  font-size: 9px;
  line-height: 13px;
  color: var(--bg-darker);
  background: var(--fire);
  border-radius: 1px;
  font-weight: 700;
  letter-spacing: 0.02em;
  animation: badgePulse 2.2s ease-in-out infinite;
}

.fake-troop-badge.shattering {
  animation: badgeShatter 480ms ease forwards;
}

@keyframes badgePulse {
  0%, 100% { opacity: 1; }
  50% { opacity: 0.62; }
}

@keyframes badgeShatter {
  0% { transform: scale(1) rotate(0deg); opacity: 1; background: var(--danger); }
  45% { transform: scale(1.18) rotate(-4deg); opacity: 0.9; background: var(--danger); }
  100% { transform: scale(0.7) translateY(8px) rotate(9deg); opacity: 0; }
}

.delta-pop {
  position: absolute;
  right: 4px;
  bottom: -16px;
  z-index: 12;
  padding: 1px 5px;
  border-radius: var(--radius);
  font-family: var(--font-ui);
  font-size: 11px;
  font-weight: 700;
  white-space: nowrap;
  pointer-events: none;
  background: var(--bg-darker);
  border: 1px solid var(--muted);
  animation: deltaFloat 1.35s cubic-bezier(0.2, 0.8, 0.2, 1) forwards;
}

.delta-pop.neg {
  color: var(--danger);
  border-color: var(--danger);
}

.delta-pop.pos {
  color: var(--ok);
  border-color: var(--ok);
}

.delta-pop.zero {
  color: var(--fire);
  border-color: var(--fire);
}

@keyframes deltaFloat {
  0% { opacity: 0; transform: translateY(4px); }
  16% { opacity: 1; transform: translateY(0); }
  75% { opacity: 1; transform: translateY(-6px); }
  100% { opacity: 0; transform: translateY(-13px); }
}

.hud-actions {
  display: flex;
  align-items: center;
  gap: 6px;
  flex: 0 0 auto;
}

.hud-btn {
  display: inline-flex;
  align-items: center;
  justify-content: center;
  width: 32px;
  height: 32px;
  border: 1px solid var(--muted);
  border-radius: var(--radius);
  background: var(--bg);
  color: var(--fg);
  font-family: var(--font-ui);
  font-size: 12px;
  transition: border-color 120ms ease, color 120ms ease, background 120ms ease;
}

.hud-btn:active {
  background: var(--selection);
}

.hud-btn.is-active {
  border-color: var(--accent);
  color: var(--accent);
}

.hud-btn svg {
  width: 15px;
  height: 15px;
  stroke: currentColor;
  fill: none;
  stroke-width: 1.8;
  stroke-linecap: square;
  stroke-linejoin: miter;
}

/* Chapter Strip */
.chapter-strip {
  position: relative;
  flex: 0 0 auto;
  height: 24px;
  display: flex;
  align-items: center;
  justify-content: space-between;
  padding: 0 12px;
  background: var(--bg-darker);
  border-bottom: 1px solid var(--muted);
  font-family: var(--font-ui);
  font-size: 11px;
  color: var(--fg-dim);
}

.chapter-label {
  display: flex;
  align-items: center;
  gap: 6px;
  min-width: 0;
  overflow: hidden;
  text-overflow: ellipsis;
  white-space: nowrap;
}

.chapter-act {
  color: var(--accent);
  font-weight: 700;
}

.chapter-step {
  font-variant-numeric: tabular-nums;
  color: var(--fg-dim);
}

.chapter-progress-track {
  position: absolute;
  left: 0;
  right: 0;
  bottom: 0;
  height: 2px;
  background: rgba(65, 72, 104, 0.35);
}

.chapter-progress-fill {
  height: 100%;
  width: 0%;
  background: var(--accent);
  transition: width 260ms ease, background 260ms ease;
}

.app-shell[data-mood="fire"] .chapter-progress-fill {
  background: var(--fire);
}

/* ==========================================================================
   Lifeline Chat Stream
   ========================================================================== */

.chat-stream {
  flex: 1 1 auto;
  min-height: 0;
  overflow-y: auto;
  overscroll-behavior-y: contain;
  -webkit-overflow-scrolling: touch;
  padding: 14px 12px 24px;
  display: flex;
  flex-direction: column;
  gap: 10px;
}

.chat-stream::-webkit-scrollbar {
  width: 3px;
}

.chat-stream::-webkit-scrollbar-thumb {
  background: var(--muted);
}

/* Chapter Divider inside stream */
.chapter-divider {
  flex: 0 0 auto;
  display: flex;
  align-items: center;
  gap: 10px;
  margin: 8px 0 4px;
  font-family: var(--font-ui);
  font-size: 11px;
  color: var(--fg-dim);
  letter-spacing: 0.06em;
  animation: bubbleIn 150ms ease-out both;
}

.chapter-divider::before,
.chapter-divider::after {
  content: "";
  flex: 1;
  height: 1px;
  background: var(--muted);
}

.chapter-divider span {
  color: var(--fg-bright);
  padding: 1px 6px;
  border: 1px solid var(--muted);
  border-radius: var(--radius);
  background: var(--bg-dark);
}

/* Bubbles */
.bubble-row {
  flex: 0 0 auto;
  display: flex;
  flex-direction: column;
  width: 100%;
  animation: bubbleIn 140ms cubic-bezier(0.2, 0.8, 0.2, 1) both;
}

.bubble-row.side-left {
  align-items: flex-start;
}

.bubble-row.side-right {
  align-items: flex-end;
}

.bubble-row.side-center {
  align-items: stretch;
}

@keyframes bubbleIn {
  from {
    opacity: 0;
    transform: translateY(6px);
  }
  to {
    opacity: 1;
    transform: translateY(0);
  }
}

.bubble {
  max-width: 89%;
  padding: 9px 11px;
  border: 1px solid var(--muted);
  border-radius: var(--radius);
  background: var(--bg-light);
  color: var(--fg);
  font-size: 14.5px;
  line-height: 1.62;
  word-break: break-word;
}

.bubble-row.side-left .bubble {
  border-left: 2px solid var(--bubble-tone, var(--accent));
}

.bubble-row.side-right .bubble {
  max-width: 85%;
  background: var(--selection);
  color: var(--fg-bright);
  border-right: 2px solid var(--accent);
}

.bubble-row.side-center .bubble {
  max-width: 100%;
  background: var(--bg-dark);
  border: 1px solid rgba(65, 72, 104, 0.8);
  border-left: 2px solid var(--bubble-tone, var(--fg-dim));
  color: var(--fg);
  font-size: 13.5px;
}

.bubble[data-tone="accent"] { --bubble-tone: var(--accent); }
.bubble[data-tone="fire"] { --bubble-tone: var(--fire); }
.bubble[data-tone="info"] { --bubble-tone: var(--info); }
.bubble[data-tone="warn"] { --bubble-tone: var(--warn); }
.bubble[data-tone="danger"] { --bubble-tone: var(--danger); }
.bubble[data-tone="ok"] { --bubble-tone: var(--ok); }
.bubble[data-tone="special"] { --bubble-tone: var(--special); }
.bubble[data-tone="earth"] { --bubble-tone: var(--earth); }
.bubble[data-tone="muted"] { --bubble-tone: var(--fg-dim); }

.bubble-head {
  display: flex;
  align-items: center;
  flex-wrap: wrap;
  gap: 6px;
  margin-bottom: 4px;
  font-family: var(--font-ui);
  font-size: 11px;
  line-height: 1.2;
}

.bubble-speaker {
  font-weight: 700;
  color: var(--fg-bright);
}

.bubble-role {
  color: var(--fg-dim);
}

.source-tag {
  margin-left: auto;
  padding: 0 4px;
  border: 1px solid var(--muted);
  border-radius: 1px;
  font-size: 10px;
  color: var(--fg-dim);
  background: var(--bg-darker);
}

.source-tag.tag-ni {
  color: var(--info);
  border-color: rgba(68, 157, 171, 0.55);
}

.source-tag.tag-yanyi {
  color: var(--special);
  border-color: rgba(173, 142, 230, 0.55);
}

body.hide-source-tags .source-tag {
  display: none;
}

.bubble-body {
  white-space: pre-line;
}

/* Settlement Strip */
.settlement-strip {
  flex: 0 0 auto;
  display: flex;
  align-items: flex-start;
  gap: 8px;
  width: 100%;
  padding: 7px 10px;
  border: 1px solid var(--muted);
  border-left: 2px solid var(--warn);
  border-radius: var(--radius);
  background: var(--bg-darker);
  font-family: var(--font-ui);
  font-size: 12px;
  line-height: 1.45;
  color: var(--fg);
  animation: bubbleIn 140ms ease-out both;
}

.settlement-strip.is-neg {
  border-left-color: var(--danger);
}

.settlement-strip.is-pos {
  border-left-color: var(--ok);
}

.settlement-strip.is-zero {
  border-left-color: var(--fire);
}

.settlement-badge {
  flex: 0 0 auto;
  padding: 1px 5px;
  border-radius: 1px;
  font-weight: 700;
  font-size: 11px;
  background: var(--bg-light);
  color: var(--warn);
}

.settlement-strip.is-neg .settlement-badge {
  color: var(--danger);
}

.settlement-strip.is-pos .settlement-badge {
  color: var(--ok);
}

.settlement-strip.is-zero .settlement-badge {
  color: var(--fire);
}

.settlement-reason {
  color: var(--fg);
}

/* ==========================================================================
   Inline Clickable Language Features (Gloss & Subtext)
   ========================================================================== */

.inline-bold {
  color: var(--fg-bright);
  font-weight: 700;
}

.inline-gloss,
.inline-subtext {
  display: inline;
  padding: 0 1px;
  border-radius: 1px;
  cursor: pointer;
  color: var(--fg-bright);
  transition: background 100ms ease;
}

.inline-gloss {
  border-bottom: 1px dotted var(--accent);
}

.inline-gloss:active {
  background: rgba(122, 162, 247, 0.22);
}

.inline-subtext {
  border-bottom: 1px dashed var(--fire);
}

.inline-subtext.is-decoded {
  border-bottom-color: var(--ok);
}

.inline-subtext:active {
  background: rgba(255, 158, 100, 0.22);
}

.inline-sup {
  display: inline-block;
  margin-left: 2px;
  padding: 0 2px;
  font-family: var(--font-ui);
  font-size: 9px;
  line-height: 1.2;
  vertical-align: super;
  border-radius: 1px;
}

.inline-gloss .inline-sup {
  color: var(--accent);
  border: 1px solid rgba(122, 162, 247, 0.45);
}

}

.quip-btn {

.war-report-title {
  margin: 3px 0 0;

}

.war-report-body {

}

.war-report-opening {

.war-section {

}

.war-section[data-tone="danger"] { border-left-color: var(--danger); }

.war-section-text {

/* ==========================================================================
   Bottom Pinned Controls: Tap Prompt & Two-Evils Choice Deck
   ========================================================================== */

.bottom-dock {
  flex: 0 0 auto;

  border-top: 1px solid var(--muted);

}

.tap-prompt {
  display: flex;
  align-items: center;
  justify-content: space-between;
  width: 100%;
  padding: 11px 14px;
  font-family: var(--font-ui);
  font-size: 12px;
  color: var(--fg-dim);
  background: var(--bg-dark);
}

.tap-prompt:active {
  background: var(--bg-light);
}

.tap-prompt-left {
  display: flex;
  align-items: center;
  gap: 6px;
  color: var(--fg);
}

.cursor-blink {
  display: inline-block;
  width: 7px;
  height: 13px;

}

}

.choice-deck {
  padding: 10px 12px 12px;

}

@keyframes deckSlideUp {

  to {

    transform: translateY(0);
  }
}

.choice-deck-hint {
  font-family: var(--font-ui);
  font-size: 10px;
  color: var(--fg-dim);
  letter-spacing: 0.05em;

}

.choice-btn {
  width: 100%;
  text-align: left;
  padding: 11px 12px;
  border: 1px solid var(--muted);
  border-left: 3px solid var(--muted);
  border-radius: var(--radius);
  background: var(--bg-light);
  transition: background 100ms ease, border-color 100ms ease, transform 80ms ease;
}

.choice-btn.is-bait {

}

.choice-btn:active {

}

.choice-label {

  color: var(--fg-bright);

}

.choice-bait {

  font-size: 11.5px;
  color: var(--fg-dim);
  line-height: 1.35;
}

.choice-btn.is-bait .choice-bait {
  color: var(--accent);
}

    const elSplashTagline = document.getElementById("splash-tagline");
    const elSplashEra = document.getElementById("splash-era");

    const elBtnResume = document.getElementById("btn-resume");

    const elBottomDock = document.getElementById("bottom-dock");

    const elChapterTitle = document.getElementById("chapter-title");

    const elPopoverSheet = document.getElementById("popover-sheet");
